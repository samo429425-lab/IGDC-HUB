<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MARU Sign-in</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b1119;color:#edf5ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;min-height:100vh}
    main{max-width:560px;padding:28px;text-align:center}
    a{color:#8fd7ff}
  </style>
</head>
<body>
<main id="status" hidden>
  <h1>MARU Player</h1>
  <p>Returning to MARU Player…</p>
  <p><a id="openPlayer" href="#">Open MARU Player</a></p>
</main>
<script>
(function(){
  'use strict';
  var query = new URLSearchParams(location.search || '');
  var state = String(query.get('state') || '');
  var isPlayer = /^mp_[A-Za-z0-9_-]+$/.test(state);
  if (!isPlayer) {
    var destination = '/index.html' + (location.search || '') + (location.hash || '');
    location.replace(destination);
    return;
  }
  var callback = new URL('maru://media-player/auth');
  ['code','state','error','error_description'].forEach(function(key){
    var value = query.get(key);
    if (value) callback.searchParams.set(key, value);
  });
  var target = callback.toString();
  var link = document.getElementById('openPlayer');
  if (link) link.href = target;
  location.replace(target);
  setTimeout(function(){
    var status = document.getElementById('status');
    if (status) status.hidden = false;
  }, 1200);
})();
</script>
</body>
</html>
