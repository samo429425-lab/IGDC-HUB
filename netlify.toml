# netlify_relaxed.toml — 완화된 CSP (https 전반 허용)
# 여러 포털/플랫폼을 넓게 쓰기 위해 https 전체, data/blob, wss 허용
[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm run start"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**", "netlify/functions/data/**", "netlify/functions/search-bank.snapshot.json", "netlify/functions/data/search-bank.snapshot.json", "data/search-bank.snapshot.json", "netlify/functions/api-key.json"]

[build.environment]
  NODE_VERSION = "20"
  
[dev]
  command = "netlify dev"
  functions = "netlify/functions"
# IGDC country/region commerce automation: hourly due-scope check.
# The function itself keeps the master switch OFF by default and only processes
# country/subdivision scopes whose configured 1-30 day interval is due.
[functions."commerce-country-ai-scheduler"]
  schedule = "@hourly"

# Apply only the latest administrator-stored, policy-gated media snapshot
# release inside the Netlify build workspace before production deployment.
[[plugins]]
  package = "./netlify/plugins/media-snapshot-release"
