  NODE_VERSION = "20"
  
[dev]
  command = "netlify dev"
  functions = "netlify/functions"
# IGDC country/region commerce automation: hourly due-scope check.
# The function itself keeps the master switch OFF by default and only processes
# country/subdivision scopes whose configured 1-30 day interval is due.
[functions."commerce-country-ai-scheduler"]
  included_files = [
      "data/search-bank.snapshot.json",
      "netlify/functions/data/distribution.snapshot.json",
      "netlify/functions/data/donation.snapshot.json",
      "netlify/functions/data/front.snapshot.json",
      "netlify/functions/data/media.snapshot.json",
      "netlify/functions/data/networkhub-snapshot.json",
      "netlify/functions/data/search-bank.snapshot.json",
      "netlify/functions/data/social.snapshot.json",
      "netlify/functions/data/tour-snapshot.json",
      "netlify/functions/lib/commerce-product-job-recovery.kr-nationwide.20260801.json",
      "netlify/functions/lib/igdc-original-product-url-evidence-20261013-all-safe.json",
      "netlify/functions/search-bank.snapshot.json",
  ]
  schedule = "@hourly"

# Apply only the latest administrator-stored, policy-gated media snapshot
