# netlify_relaxed.toml — 완화된 CSP (https 전반 허용)
# 여러 포털/플랫폼을 넓게 쓰기 위해 https 전체, data/blob, wss 허용
[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm run start"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**", "netlify/functions/data/**", "netlify/functions/search-bank.snapshot.json", "netlify/functions/data/search-bank.snapshot.json", "data/search-bank.snapshot.json", "netlify/functions/api-key.json"]

[build.environment]
  NODE_VERSION = "20"
  
[dev]
  command = "netlify dev"
  functions = "netlify/functions"
# IGDC country/region commerce automation: staggered DB-load protection.
# UTC slots: supplier 0/3, product 1, private PSOM 2 per five minutes; hourly maintenance minute 4.
# Existing per-country leases and cycle/approval rules are unchanged.
# The function itself keeps the master switch OFF by default and only processes
# country/subdivision scopes whose configured 1-30 day interval is due.
[functions."commerce-country-ai-scheduler"]
  schedule = "4 * * * *"

# Checkpointed supplier discovery is the FIRST stage of selected-country automation.
# Declare the schedule here as well as in the function module so deployment
# discovers this worker even when the code-level schedule is not picked up.
[functions."commerce-country-supplier-research-scheduler"]
  schedule = "0,3,5,8,10,13,15,18,20,23,25,28,30,33,35,38,40,43,45,48,50,53,55,58 * * * *"

# Checkpointed private product research -> PSOM for AUTOMATED IP markets only.
# Runs separately from supplier discovery and never auto-publishes.
[functions."commerce-country-product-ai-scheduler"]
  schedule = "1-59/5 * * * *"

# Verified, private PSOM placement is separated from slow product discovery.
# No automatic Front Match or public publication is performed here.
[functions."commerce-country-private-psom-scheduler"]
  schedule = "2-59/5 * * * *"

# Apply only the latest administrator-stored, policy-gated media snapshot
# release inside the Netlify build workspace before production deployment.
[[plugins]]
  package = "./netlify/plugins/media-snapshot-release"

# Social content refresh: registered creators are priority seeds, while broad discovery remains active.
[functions."social-content-rotation-scheduler"]
  schedule = "20 18 * * 1,3,6"

# IGDC unified search exposure engine: one central Edge metadata injector, no per-front-page edits.
[[edge_functions]]
  function = "search-meta-injector"
  path = "/*"

[functions."global-search-exposure-engine"]
  schedule = "17 3,11,21 * * *"

[[redirects]]
  from = "/sitemap-global.xml"
  to = "/.netlify/functions/global-search-sitemap"
  status = 200

[[redirects]]
  from = "/product/*"
  to = "/.netlify/functions/product-search-detail"
  status = 200

[[redirects]]
  from = "/media-content/*"
  to = "/.netlify/functions/media-search-detail"
  status = 200

# Distribution Center FX reference-rate collection (opt-in server environment only).
[functions."distribution-center-fx-refresh"]
  schedule = "@daily"
