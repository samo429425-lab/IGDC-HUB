# netlify_relaxed.toml — 완화된 CSP (https 전반 허용)
# 여러 포털/플랫폼을 넓게 쓰기 위해 https 전체, data/blob, wss 허용
[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm run start"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Bundle JS runtime dependencies but not all large product/media snapshot data
  # into every function. Large, read-only JSON assets are scoped below.
  # Media catalog and payout-vault files are included only by their consumers.
  # If new runtime fs.readFileSync assets are added, update per-function lists.
  included_files = [
    # Static JS dependencies are traced by esbuild. Never copy all 217 Function
    # entrypoints and 68 libraries into EVERY Lambda bundle: those inclusive
    # globs inflate archives and can exceed AWS Lambda 250 MB unzipped limit.
    # Only dynamic/optional require() targets need an explicit inclusion.
    "netlify/functions/collector.js",
    "netlify/functions/planetary-data-connector.js",
    "netlify/functions/search-bank-engine.js",
    "netlify/functions/maru-search.js",
    "netlify/functions/maru-intelligence-engine.js",
    "netlify/functions/lib/trustFilter.core.v1.js",
    "netlify/functions/lib/trustFilter.v1.js",
    "netlify/functions/data/affiliate-program-registry.v1.json",
    "netlify/functions/data/commerce-candidate-policy.v1.json",
    "netlify/functions/data/commerce-candidate-review-queue.v1.json",
    "netlify/functions/data/country-policy.json",
    "netlify/functions/data/country-region-registry.v1.json",
    "netlify/functions/data/country-subdivision-registry.v1.json",
    "netlify/functions/data/distribution-priority-listings.json",
    "netlify/functions/data/donation.research-frame.v1.json",
    "netlify/functions/data/igdc-support-knowledge.json",
    "netlify/functions/data/igdc.platform.profile.json",
    "netlify/functions/data/ip-slot-policy.v1.json",
    "netlify/functions/data/psom.json",
    "netlify/functions/data/regional-brokerage-policy.json",
    "netlify/functions/data/social.candidates.snapshot.json",
    "netlify/functions/data/tour.snapshot.json",
    "netlify/functions/data/trust.allowlist.json",
    "netlify/functions/data/trust.blocklist.json",
    "netlify/functions/lib/igdc-historical-private-placement-20261013.json",
    "netlify/functions/api-key.json",
  ]

