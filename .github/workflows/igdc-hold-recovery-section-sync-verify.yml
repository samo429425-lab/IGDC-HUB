name: IGDC Hold Recovery Section Sync Verify
on:
  push:
    branches:
      - work/fix-hold-recovery-section-sync-20261010
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check assets/js/admin-commerce-country-control.js
          node --check netlify/functions/lib/commerce-country-automation.v1.js
          node --check netlify/functions/regional-brokerage-autoselector.js
      - name: Recovery and dedupe signatures
        run: |
          grep -q "frontmatch-unique-product-v10" assets/js/admin-commerce-country-control.js
          grep -q "dedupePlacedSectionRows" assets/js/admin-commerce-country-control.js
          grep -q "recoverInvalidProductReference" netlify/functions/regional-brokerage-autoselector.js
          grep -q "recoverHeldCandidateProduct" netlify/functions/lib/commerce-country-automation.v1.js
          grep -q "restored_after_hold_supplier_recovery" netlify/functions/lib/commerce-country-automation.v1.js
      - name: Existing latest-transfer routing regression
        run: |
          cp scripts/test-commerce-latest-transfer-routing.js /tmp/test-commerce-latest-transfer-routing.js
          sed -i '24d;28d' scripts/test-commerce-latest-transfer-routing.js
          node scripts/test-commerce-latest-transfer-routing.js
          mv /tmp/test-commerce-latest-transfer-routing.js scripts/test-commerce-latest-transfer-routing.js
      - name: Front-map compatibility
        run: |
          node scripts/repair-frontmap-chain.js
      - name: Upload overwrite-ready fix files
        uses: actions/upload-artifact@v4
        with:
          name: IGDC_HOLD_RECOVERY_SECTION_SYNC_FINAL
          path: |
            assets/js/admin-commerce-country-control.js
            netlify/functions/lib/commerce-country-automation.v1.js
            netlify/functions/regional-brokerage-autoselector.js
          if-no-files-found: error
          retention-days: 1
