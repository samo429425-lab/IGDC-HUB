name: ChatGPT IGDC final source-authority package

on:
  push:
    branches:
      - chatgpt-frontmatch-final-source-authority-20261009

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check changed pipeline
        run: |
          set -euo pipefail
          node --check assets/js/admin-commerce-country-control.js
          node --check netlify/functions/commerce-country-control.js
          node --check netlify/functions/lib/commerce-country-automation.v1.js
          node --check netlify/functions/regional-brokerage-autoselector.js
          node --check netlify/functions/lib/commerce-candidate-registry-sync.baseline-1229.v1.js
          node --check netlify/functions/lib/commerce-candidate-registry-sync.v1.js
          node --check netlify/functions/lib/commerce-candidate-intake.v1.js
          node --check netlify/functions/lib/canonical-snapshot-publisher.v1.js
          node --check netlify/functions/snapshot-engine.js
          node --check scripts/build-regional-brokerage-snapshots.js
          node --check scripts/verify-admin-searchbank-handoff.js
          node --check netlify/functions/lib/ip-slot-snapshot-publisher.v1.js
          node --check netlify/functions/lib/regional-brokerage-publisher.v1.js
          node --check assets/js/home-products-automap.v2.js
          node --check assets/js/distribution-products-automap.v3.js
      - name: Build overwrite-ready ZIP
        run: |
          set -euo pipefail
          mkdir -p package
          files=(
            "assets/js/admin-commerce-country-control.js"
            "assets/js/home-products-automap.v2.js"
            "assets/js/distribution-products-automap.v3.js"
            "netlify/functions/commerce-country-control.js"
            "netlify/functions/regional-brokerage-autoselector.js"
            "netlify/functions/lib/commerce-country-automation.v1.js"
            "netlify/functions/lib/commerce-candidate-registry-sync.baseline-1229.v1.js"
            "netlify/functions/lib/commerce-candidate-registry-sync.v1.js"
            "netlify/functions/lib/commerce-candidate-intake.v1.js"
            "netlify/functions/lib/canonical-snapshot-publisher.v1.js"
            "netlify/functions/lib/ip-slot-snapshot-publisher.v1.js"
            "netlify/functions/lib/regional-brokerage-publisher.v1.js"
            "netlify/functions/snapshot-engine.js"
            "netlify/edge-functions/regional-brokerage-snapshot-router.js"
            "scripts/build-regional-brokerage-snapshots.js"
            "scripts/verify-admin-searchbank-handoff.js"
          )
          for f in "${files[@]}"; do
            mkdir -p "package/$(dirname "$f")"
            cp "$f" "package/$f"
          done
          (
            cd package
            zip -r "../IGDC-HUB_FRONTMATCH_FINAL_SOURCE_AUTHORITY_20261009.zip" .
          )
      - uses: actions/upload-artifact@v4
        with:
          name: IGDC-HUB_FRONTMATCH_FINAL_SOURCE_AUTHORITY_20261009
          path: IGDC-HUB_FRONTMATCH_FINAL_SOURCE_AUTHORITY_20261009.zip
          if-no-files-found: error
          retention-days: 1
