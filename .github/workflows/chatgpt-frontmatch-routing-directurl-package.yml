name: ChatGPT FrontMatch routing direct-url package

on:
  push:
    branches:
      - chatgpt-frontmatch-routing-directurl-final-20261009

permissions:
  contents: read

jobs:
  verify-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          set -euo pipefail
          node --check netlify/functions/snapshot-engine.js
          node --check netlify/functions/lib/ip-slot-snapshot-publisher.v1.js
          node --check netlify/functions/lib/regional-brokerage-publisher.v1.js
          node --check scripts/build-regional-brokerage-snapshots.js
          node --check assets/js/distribution-products-automap.v3.js
          node --check assets/js/home-products-automap.v2.js
          node --check assets/js/network-rightpanel-automap.js
          node --check scripts/repair-frontmap-chain.js
          node --check scripts/test-frontmatch-routing-directurl.js
      - name: Repair script idempotence
        run: |
          set -euo pipefail
          node scripts/repair-frontmap-chain.js
          git diff --exit-code
      - name: Routing regression
        run: |
          set -euo pipefail
          node scripts/test-frontmatch-routing-directurl.js
      - name: Build overwrite-ready ZIP
        run: |
          set -euo pipefail
          mkdir -p package
          files=(
            "netlify/functions/snapshot-engine.js"
            "netlify/functions/lib/ip-slot-snapshot-publisher.v1.js"
            "netlify/functions/lib/regional-brokerage-publisher.v1.js"
            "scripts/build-regional-brokerage-snapshots.js"
            "assets/js/distribution-products-automap.v3.js"
            "assets/js/home-products-automap.v2.js"
            "assets/js/network-rightpanel-automap.js"
            "scripts/repair-frontmap-chain.js"
            "scripts/test-frontmatch-routing-directurl.js"
          )
          for f in "${files[@]}"; do
            mkdir -p "package/$(dirname "$f")"
            cp "$f" "package/$f"
          done
          (
            cd package
            zip -r "../IGDC-HUB_FRONTMATCH_ROUTING_DIRECTURL_FINAL_20261009.zip" .
          )
          sha256sum IGDC-HUB_FRONTMATCH_ROUTING_DIRECTURL_FINAL_20261009.zip
      - uses: actions/upload-artifact@v4
        with:
          name: IGDC-HUB_FRONTMATCH_ROUTING_DIRECTURL_FINAL_20261009
          path: IGDC-HUB_FRONTMATCH_ROUTING_DIRECTURL_FINAL_20261009.zip
          if-no-files-found: error
          retention-days: 1
