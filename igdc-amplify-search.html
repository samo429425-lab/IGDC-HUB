<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGDC 글로벌 유통상품 검색 | 제조사·브랜드·상품명 검색</title><meta name="description" content="IGDC 공개 유통상품을 상품명, 모델명, 브랜드, 제조사, 국가별로 검색하고 검증된 판매처로 연결합니다."><meta name="robots" content="index,follow"><link rel="canonical" href="https://igdcglobal.com/igdc-amplify-search.html"><style>body{font:16px/1.6 system-ui,-apple-system,'Malgun Gothic',sans-serif;background:#f6f7fa;color:#17253c;margin:0}main{max-width:1000px;margin:0 auto;padding:22px}a{color:#24548c}.top{display:flex;gap:16px;justify-content:space-between;align-items:center}.panel{background:white;border:1px solid #dae1e9;border-radius:14px;padding:22px}.find{display:flex;gap:8px;flex-wrap:wrap}.find input,.find select{padding:12px;border:1px solid #aebdcc;border-radius:7px;font-size:16px}.find input{flex:1;min-width:180px}.find button{background:#19497a;color:white;border:0;padding:12px 20px;border-radius:7px;cursor:pointer}.item{padding:14px 4px;border-bottom:1px solid #e6ecf3}.item h2{margin:0;font-size:18px}.info{font-size:13px;color:#5f6b78}.notice{color:#5e6877;font-size:13px}</style></head><body><main><header class="top"><h1>IGDC 글로벌 유통상품 검색</h1><a href="/distributionhub.html">유통 허브</a></header><section class="panel"><p>상품명만 입력해도 검색할 수 있습니다. 브랜드·모델명·제조사 검색도 지원합니다.</p><form id="search" class="find"><input type="search" id="q" name="q" maxlength="120" placeholder="상품명 또는 모델명을 입력하세요" aria-label="상품명"><input type="text" id="country" name="country" maxlength="2" pattern="[A-Za-z]{2}" placeholder="국가 코드 (선택: KR, US 등)" aria-label="판매 국가 코드 (선택)"><button type="submit">검색</button></form><p id="state" role="status" aria-live="polite"></p><div id="results"></div><p class="notice">IGDC는 판매처 연결과 상품 정보 탐색을 돕는 서비스입니다. 판매·결제·배송·A/S·환불은 실제 판매처의 조건을 확인하십시오.</p></section></main><script>
(()=>{'use strict';const form=document.getElementById('search'),q=document.getElementById('q'),country=document.getElementById('country'),state=document.getElementById('state'),results=document.getElementById('results');const init=new URLSearchParams(location.search);q.value=init.get('q')||'';if(/^[A-Za-z]{2}$/.test(init.get('country')||''))country.value=init.get('country').toUpperCase();const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text)n.textContent=text;return n;};async function run(){results.replaceChildren();state.textContent='검색 중입니다.';const params=new URLSearchParams({q:q.value,country:country.value.trim().toUpperCase(),limit:'30'});history.replaceState(null,'','?'+params.toString());try{const resp=await fetch('/.netlify/functions/igdc-amplify-query?'+params.toString(),{credentials:'omit'});const data=await resp.json();if(!resp.ok||!data.ok)throw Error('검색을 처리할 수 없습니다.');if(!data.publicationReady){state.textContent='현재 공개 상품 검색 자료가 준비되지 않았습니다.';return;}state.textContent='검색 결과 '+data.total+'건'+(data.total>data.items.length?' (상위 '+data.items.length+'건 표시)':'');for(const x of data.items){const block=el('article','item'),h=el('h2'),a=el('a',null,x.productName||x.title);a.href=x.url;h.append(a);block.append(h);if(x.description)block.append(el('p',null,x.description.slice(0,200)));block.append(el('p','info',[x.brand,x.manufacturer,x.category,x.markets.join(', ')].filter(Boolean).join(' · ')));results.append(block);}}catch(_){state.textContent='현재 검색 결과를 불러올 수 없습니다.';}}form.addEventListener('submit',e=>{e.preventDefault();run();});if(q.value)run();})();
</script></body></html>
