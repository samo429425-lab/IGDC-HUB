<style>
  :root { --igdc-blue:#004080; --igdc-line:#d9e4f2; --igdc-bg:#f5f8fc; --igdc-card:#ffffff; --igdc-text:#17324d; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--igdc-bg); color:var(--igdc-text); }
  .wrap { max-width:1100px; margin:0 auto; padding:26px 18px 60px; }
  .hero { background:linear-gradient(135deg,#eaf4ff,#ffffff); border:1px solid var(--igdc-line); border-radius:18px; padding:26px; box-shadow:0 4px 18px rgba(0,0,0,.05); }
  h1 { margin:0 0 8px; color:#003b75; font-size:30px; }
  .subtitle { margin:0 0 18px; line-height:1.6; color:#4c6177; }
  .legalOperator { display:inline-flex; flex-direction:column; gap:2px; margin:0 0 14px; padding:10px 14px; background:#fff; border:1px solid var(--igdc-line); border-radius:10px; }
  .legalOperator strong { color:#17324d; font-size:16px; }
  .legalOperator span { color:#4c6177; font-size:16px; font-weight:700; }
  .guideLines { margin-top:14px; color:#33485e; line-height:1.55; }
  .guideLines p { margin:0; }
  .emailRow { margin-top:18px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .emailLabel { font-weight:700; color:#183e63; }
  .email { color:#004080; font-weight:700; text-decoration:none; background:#eef6ff; border:1px solid #cfe4fa; border-radius:9px; padding:9px 12px; }

  .qnaForm { display:grid; gap:8px; }
  .qnaForm input, .qnaForm textarea { width:100%; border:1px solid #bfd0e3; border-radius:9px; padding:9px 10px; font:inherit; }
  .qnaForm textarea { min-height:92px; resize:vertical; }
  .qnaActions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .qnaAnswer { display:none; margin-top:10px; white-space:pre-wrap; line-height:1.55; background:#f7fbff; border:1px solid #dcecff; border-radius:10px; padding:10px 12px; }
  .aiMailModal[hidden] { display:none !important; }
  .aiMailModal { position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,.38); display:flex; align-items:center; justify-content:center; padding:18px; }
  .aiMailDialog { width:min(620px, 100%); background:#fff; border:1px solid var(--igdc-line); border-radius:16px; padding:18px; box-shadow:0 12px 40px rgba(0,0,0,.2); position:relative; }
  .aiMailDialog h2 { margin:0 34px 8px 0; font-size:20px; color:#004080; }
  .aiMailDialog p { margin:0 0 12px; color:#4c6177; line-height:1.55; }
  .aiMailClose { position:absolute; top:10px; right:12px; width:30px; height:30px; border:0; border-radius:50%; background:#eef6ff; color:#004080; font-size:20px; cursor:pointer; }
  .officialEmail { margin-top:18px; background:#fff; border:1px solid var(--igdc-line); border-radius:14px; padding:16px; text-align:center; }
  .officialEmail p { margin:0 0 10px; color:#5b7189; line-height:1.55; }
  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:18px; }
  .card { background:var(--igdc-card); border:1px solid var(--igdc-line); border-radius:14px; padding:18px; box-shadow:0 2px 10px rgba(0,0,0,.03); }
  .card h2 { margin:0 0 10px; font-size:20px; color:#004080; }
  .card p { margin:0 0 10px; line-height:1.65; }
  ul { margin:8px 0 0 20px; padding:0; line-height:1.7; }
  .downloadList { display:grid; grid-template-columns:1fr; gap:10px; margin-top:12px; }
  .downloadItem { border:1px solid #e0e8f2; background:#fbfdff; border-radius:12px; padding:14px; display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; }
  .downloadItem b { display:block; color:#183e63; margin-bottom:4px; }
  .downloadItem span { color:#5b7189; font-size:13px; }
  .policyActions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .btn { display:inline-block; text-decoration:none; border-radius:9px; padding:9px 12px; border:1px solid #b9d2ee; color:#004080; background:#eef7ff; font-weight:700; }
  .notice { margin-top:12px; color:#7a5600; background:#fff8e5; border:1px solid #f2dfad; border-radius:10px; padding:10px 12px; font-size:14px; }
  .full { grid-column:1/-1; }
  .footer { margin-top:18px; color:#6f7f8f; font-size:13px; text-align:center; }
  /* The iframe document itself must remain LTR so Chrome keeps its vertical scrollbar on the physical right.
     RTL is applied only to the support content panels below. */
  html, body { direction:ltr !important; }
  body.rtl ul { margin:8px 20px 0 0; }
  @media (max-width:760px) { .grid { grid-template-columns:1fr; } h1 { font-size:25px; } }
</style>

<style id="support-sidebar-shell-css">
/* Support page sidebar: desktop only, left fixed in all languages including RTL. */
.support-shell{
  display:flex;
  flex-direction:row;
  align-items:stretch;
  width:100%;
  min-height:100vh;
  direction:ltr !important;
}
.support-sidebar{
  flex:0 0 210px;
  width:210px;
  background:#e0e0e0;
  display:flex;
  flex-direction:column;
  padding-top:30px;
  min-height:100vh;
}
.support-sidebar a{
  display:block;
  background-color:#fff4e0;
  color:#804000;
  text-decoration:none;
  padding:12px 8px;
  font-weight:bold;
  font-size:1rem;
  border:1px solid #f3d9b0;
  border-radius:8px;
  margin:10px 5px;
  transition:background-color .3s, text-decoration .3s;
  direction:inherit;
}
.support-sidebar a:hover{background-color:#ffe5b4;text-decoration:underline;}
.support-sidebar #qnaOpenBtn{background-color:#001f4d !important;color:#ffffff !important;}
.support-main{
  flex:1 1 auto;
  min-width:0;
  direction:ltr;
}
body.rtl .support-main{direction:rtl;}
body.rtl .support-sidebar{direction:rtl; text-align:right;}
body.rtl .support-shell{direction:ltr !important;}
@media (max-width:1023.98px){
  .support-shell{display:block;}
  .support-sidebar{display:none !important;}
  .support-main{width:100%;}
}
</style>

<style id="igdc-qa-style">
:root{
  --igdc-z:2147483000; --igdc-radius:14px; --igdc-shadow:0 10px 30px rgba(0,0,0,.18);
  --igdc-gap:10px; --igdc-font:system-ui,Segoe UI,Apple SD Gothic Neo,Malgun Gothic,Roboto,sans-serif;
  --qa-left:260px;
  --old-bg:#fff4e0; --old-border:#f3d9b0; --old-text:#804000;
  --blue:#2563eb; --muted:#9ca3af;
}
/* Sidebar Q&A link follows existing .sidebar a style; this extra ensures visibility if needed */
#qnaOpenBtn{ background-color:#001f4d; color:#ffffff;  color:#001f4d;  display:block; text-decoration:none; }
/* Modal near the left sidebar, with smooth transitions */
.igdc-qa-modal{position:fixed;inset:0;z-index:var(--igdc-z);pointer-events:none}
.igdc-qa-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .18s ease}
.igdc-qa-panel{
  position:fixed; left:var(--qa-left); bottom:84px; width:min(560px,50vw);
  max-height:min(82vh,900px); display:flex; flex-direction:column;
  background:#fff; border-radius:var(--igdc-radius); box-shadow:var(--igdc-shadow);
  overflow:hidden; opacity:0; transform:translateY(12px) scale(.98);
  transition:opacity .18s ease, transform .18s ease;
  border:1px solid var(--old-border);
}
.igdc-qa-modal.open{pointer-events:auto}
.igdc-qa-modal.open .igdc-qa-backdrop{opacity:1}
.igdc-qa-modal.open .igdc-qa-panel{opacity:1; transform:none}
/* Old-style header tint */
.igdc-qa-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 14px; border-bottom:1px solid var(--old-border);
  background:var(--old-bg);
}
.igdc-qa-title{font:700 14px/1.2 var(--igdc-font); color:var(--old-text)}
.igdc-qa-close{cursor:pointer; border:none; background:transparent; font-size:18px; color:#333}
.igdc-qa-body{display:flex; flex-direction:column; gap:10px; padding:12px; overflow:auto}
.igdc-qa-field label{display:block; font:700 12px/1.2 var(--igdc-font); margin-bottom:6px; color:#333}
.igdc-qa-text{
  width:100%; max-width:100%; box-sizing:border-box; resize:vertical;
  border:1px solid var(--old-border); border-radius:10px; padding:10px 12px;
  font:500 14px var(--igdc-font); min-height:44px; background:#fffdf8;
}
.igdc-qa-text.q{ min-height: 96px; }
.igdc-qa-text.a{ min-height: 128px; }
.igdc-qa-actions{display:flex; gap:8px; align-items:center}
.igdc-qa-btn{border:none; border-radius:10px; padding:10px 14px; font:700 14px; cursor:pointer}
.igdc-qa-btn.primary{background:var(--blue); color:#fff}
.igdc-qa-btn.muted{background:var(--muted); color:#fff}
.igdc-qa-threads{display:flex; flex-direction:column; gap:10px; overflow:auto; border-top:1px solid var(--old-border); padding-top:10px}
.igdc-qa-thread{border:1px solid var(--old-border); border-radius:12px; padding:10px 12px; background:#fffdf8}
.igdc-qa-thread-q{font:700 13px/1.5 var(--igdc-font); color:#222}
.igdc-qa-thread-a{font:13px/1.5 var(--igdc-font); color:#333; margin-top:6px}
.igdc-qa-thread-meta{display:flex; gap:8px; align-items:center; color:#775; font:12px/1.2 var(--igdc-font); margin-top:8px}
.igdc-qa-thread-actions{margin-left:auto; display:flex; gap:6px}
.igdc-qa-note{font:12px/1.4 var(--igdc-font); color:#666}
@media (max-width:900px){
  .igdc-qa-panel{ left:calc(12px + var(--qa-left,0px)); width:min(92vw,560px) }
}
</style>
<style id="igdc-qa-panel-position-final-v1">
/* IGDC Q&A modal position final: keep button/function intact, lift the modal near the index nav bottom. */
.igdc-qa-modal .igdc-qa-panel,
.igdc-qa-panel{
  top:18px !important;
  bottom:auto !important;
  max-height:calc(100dvh - 36px) !important;
  overflow:hidden !important;
}
.igdc-qa-modal .igdc-qa-body,
.igdc-qa-panel .igdc-qa-body{
  max-height:calc(100dvh - 150px) !important;
  overflow-y:auto !important;
  -webkit-overflow-scrolling:touch !important;
}
@media (max-width:768px){
  .igdc-qa-modal .igdc-qa-panel,
  .igdc-qa-panel{
    top:14px !important;
    bottom:auto !important;
    max-height:calc(100dvh - 28px) !important;
  }
  .igdc-qa-modal .igdc-qa-body,
  .igdc-qa-panel .igdc-qa-body{
    max-height:calc(100dvh - 132px) !important;
  }
}
</style>
</head>

  ko:{guideSteps:"1. IGDC 도움말를 엽니다.\n2. MARU Media Player · Windows 항목 옆의 다운로드 버튼을 누르고 maru-media-player-setup.exe 파일을 저장합니다.\n3. 다운로드가 끝나면 설치 파일을 실행합니다. Windows 보안 확인 창이 나오면 IGDC 공식 사이트에서 받은 파일임을 확인한 경우에만 계속합니다.",guideAdditionalNotes:"다운로드 시간은 네트워크 상태에 따라 달라질 수 있습니다. Android/모바일 앱은 현재 이 페이지에서 배포하지 않습니다. 새 버전이 출시되면 같은 공식 다운로드 위치의 설치 파일이 교체될 수 있습니다. 비공식 링크의 파일은 다운로드하거나 실행하지 마십시오."},
  en:{guideSteps:"1. Open the IGDC Help.\n2. Click Download next to MARU Media Player · Windows and save maru-media-player-setup.exe.\n3. Run the installer after the download. Continue a Windows security prompt only after confirming that the file came from the official IGDC site.",guideAdditionalNotes:"Download time may vary with the network. The Android/mobile app is not distributed on this page at this stage. A later release may replace the installer at the same official download location. Do not download or run files from unofficial links."},
  zh:{guideSteps:"1. 打开 IGDC 帮助 · 下载中心。\n2. 点击 MARU Media Player · Windows 项目旁的下载按钮，并保存 maru-media-player-setup.exe。\n3. 下载完成后运行安装程序。只有确认文件来自 IGDC 官方网站时，才继续 Windows 安全确认。",guideAdditionalNotes:"下载时间可能因网络状况而不同。现阶段本页面不提供 Android/移动应用。后续版本可能会在同一官方下载位置替换安装文件。请勿下载或运行来自非官方链接的文件。"},
  zht:{guideSteps:"1. 開啟 IGDC 說明 · 下載中心。\n2. 點擊 MARU Media Player · Windows 項目旁的下載按鈕，並儲存 maru-media-player-setup.exe。\n3. 下載完成後執行安裝程式。只有確認檔案來自 IGDC 官方網站時，才繼續 Windows 安全確認。",guideAdditionalNotes:"下載時間可能因網路狀況而不同。現階段本頁面不提供 Android/行動應用程式。後續版本可能會在相同官方下載位置替換安裝檔。請勿下載或執行來自非官方連結的檔案。"},
  ja:{guideSteps:"1. IGDCヘルプ・ダウンロードセンターを開きます。\n2. MARU Media Player · Windows の横にあるダウンロードを押し、maru-media-player-setup.exe を保存します。\n3. ダウンロード完了後にインストーラーを実行します。Windows のセキュリティ確認は、IGDC公式サイトから取得したファイルであることを確認した場合にのみ続行してください。",guideAdditionalNotes:"ダウンロード時間はネットワーク状況により異なります。Android/モバイルアプリは現時点ではこのページで配布していません。今後の版では同じ公式ダウンロード先のインストーラーが置き換えられる場合があります。非公式リンクのファイルはダウンロードまたは実行しないでください。"},
  es:{guideSteps:"1. Abra el Centro de ayuda y descargas de IGDC.\n2. Haga clic en Descargar junto a MARU Media Player · Windows y guarde maru-media-player-setup.exe.\n3. Ejecute el instalador cuando termine la descarga. Continúe una confirmación de seguridad de Windows solo después de comprobar que el archivo procede del sitio oficial de IGDC.",guideAdditionalNotes:"El tiempo de descarga puede variar según la red. La aplicación Android/móvil no se distribuye actualmente en esta página. Una versión futura puede sustituir el instalador en la misma ubicación oficial. No descargue ni ejecute archivos de enlaces no oficiales."},
  fr:{guideSteps:"1. Ouvrez le centre d’aide et de téléchargement IGDC.\n2. Cliquez sur Télécharger à côté de MARU Media Player · Windows et enregistrez maru-media-player-setup.exe.\n3. Lancez le programme d’installation après le téléchargement. Ne poursuivez une confirmation de sécurité Windows qu’après avoir vérifié que le fichier provient du site officiel IGDC.",guideAdditionalNotes:"La durée du téléchargement peut varier selon le réseau. L’application Android/mobile n’est pas distribuée sur cette page à ce stade. Une version ultérieure peut remplacer l’installateur au même emplacement officiel. Ne téléchargez ni n’exécutez de fichiers provenant de liens non officiels."},
  de:{guideSteps:"1. Öffnen Sie das IGDC-Hilfe- und Download-Center.\n2. Klicken Sie neben MARU Media Player · Windows auf Herunterladen und speichern Sie maru-media-player-setup.exe.\n3. Starten Sie das Installationsprogramm nach dem Download. Setzen Sie eine Windows-Sicherheitsabfrage nur fort, nachdem Sie bestätigt haben, dass die Datei von der offiziellen IGDC-Website stammt.",guideAdditionalNotes:"Die Downloadzeit kann je nach Netzwerk variieren. Die Android/Mobil-App wird derzeit nicht auf dieser Seite verteilt. Eine spätere Version kann die Installationsdatei am selben offiziellen Downloadort ersetzen. Laden Sie keine Dateien von inoffiziellen Links herunter und führen Sie sie nicht aus."},
  ru:{guideSteps:"1. Откройте справочный центр и центр загрузок IGDC.\n2. Нажмите Скачать рядом с MARU Media Player · Windows и сохраните maru-media-player-setup.exe.\n3. После завершения загрузки запустите установщик. Продолжайте проверку безопасности Windows только после подтверждения, что файл получен с официального сайта IGDC.",guideAdditionalNotes:"Время загрузки зависит от сети. Приложение для Android/мобильных устройств пока не распространяется на этой странице. Будущая версия может заменить установщик по тому же официальному адресу загрузки. Не загружайте и не запускайте файлы по неофициальным ссылкам."},
  pt:{guideSteps:"1. Abra a Central de Ajuda e Downloads da IGDC.\n2. Clique em Baixar ao lado de MARU Media Player · Windows e salve maru-media-player-setup.exe.\n3. Execute o instalador após o download. Prossiga em uma confirmação de segurança do Windows somente depois de confirmar que o arquivo veio do site oficial da IGDC.",guideAdditionalNotes:"O tempo de download pode variar conforme a rede. O aplicativo Android/móvel não é distribuído nesta página nesta fase. Uma versão futura poderá substituir o instalador no mesmo local oficial. Não baixe nem execute arquivos de links não oficiais."},
  it:{guideSteps:"1. Apri il Centro assistenza e download IGDC.\n2. Fai clic su Scarica accanto a MARU Media Player · Windows e salva maru-media-player-setup.exe.\n3. Al termine del download esegui il programma di installazione. Procedi con una conferma di sicurezza di Windows solo dopo avere verificato che il file proviene dal sito ufficiale IGDC.",guideAdditionalNotes:"Il tempo di download può variare in base alla rete. L’app Android/mobile non viene distribuita in questa pagina in questa fase. Una versione futura può sostituire l’installer nella stessa posizione ufficiale. Non scaricare né eseguire file da collegamenti non ufficiali."},
  ar:{guideSteps:"1. افتح مركز مساعدة وتنزيلات IGDC.\n2. اضغط على تنزيل بجوار MARU Media Player · Windows واحفظ الملف maru-media-player-setup.exe.\n3. شغّل برنامج التثبيت بعد اكتمال التنزيل. لا تتابع تأكيد أمان Windows إلا بعد التحقق من أن الملف جاء من موقع IGDC الرسمي.",guideAdditionalNotes:"قد يختلف وقت التنزيل بحسب الشبكة. لا يتم توزيع تطبيق Android/الجوال في هذه الصفحة حالياً. قد يستبدل إصدار لاحق ملف التثبيت في موقع التنزيل الرسمي نفسه. لا تنزّل أو تشغّل ملفات من روابط غير رسمية."},
  vi:{guideSteps:"1. Mở Trung tâm Trợ giúp và Tải xuống IGDC.\n2. Nhấp Tải xuống bên cạnh MARU Media Player · Windows và lưu maru-media-player-setup.exe.\n3. Chạy trình cài đặt sau khi tải xong. Chỉ tiếp tục xác nhận bảo mật của Windows khi đã xác nhận tệp đến từ trang IGDC chính thức.",guideAdditionalNotes:"Thời gian tải có thể khác nhau tùy mạng. Ứng dụng Android/di động hiện chưa được phát hành trên trang này. Bản phát hành sau có thể thay thế tệp cài đặt tại cùng vị trí tải xuống chính thức. Không tải hoặc chạy tệp từ liên kết không chính thức."},
  th:{guideSteps:"1. เปิดศูนย์ช่วยเหลือและดาวน์โหลด IGDC\n2. กดดาวน์โหลดข้าง MARU Media Player · Windows แล้วบันทึกไฟล์ maru-media-player-setup.exe\n3. เมื่อดาวน์โหลดเสร็จให้เรียกใช้ตัวติดตั้ง และดำเนินการยืนยันความปลอดภัยของ Windows ต่อเมื่อยืนยันได้ว่าไฟล์มาจากเว็บไซต์ทางการของ IGDC เท่านั้น",guideAdditionalNotes:"ระยะเวลาดาวน์โหลดอาจต่างกันตามเครือข่าย แอป Android/มือถือยังไม่ได้เผยแพร่ในหน้านี้ รุ่นใหม่ในอนาคตอาจแทนที่ไฟล์ติดตั้งในตำแหน่งดาวน์โหลดทางการเดิม ห้ามดาวน์โหลดหรือเรียกใช้ไฟล์จากลิงก์ที่ไม่เป็นทางการ"},
  id:{guideSteps:"1. Buka Pusat Bantuan dan Unduhan IGDC.\n2. Klik Unduh di samping MARU Media Player · Windows dan simpan maru-media-player-setup.exe.\n3. Jalankan penginstal setelah unduhan selesai. Lanjutkan konfirmasi keamanan Windows hanya setelah memastikan bahwa file berasal dari situs resmi IGDC.",guideAdditionalNotes:"Waktu unduhan dapat berbeda bergantung pada jaringan. Aplikasi Android/seluler belum didistribusikan pada halaman ini. Rilis berikutnya dapat mengganti penginstal di lokasi unduhan resmi yang sama. Jangan mengunduh atau menjalankan file dari tautan tidak resmi."},
  hi:{guideSteps:"1. IGDC सहायता और डाउनलोड केंद्र खोलें।\n2. MARU Media Player · Windows के पास डाउनलोड करें दबाएँ और maru-media-player-setup.exe सहेजें।\n3. डाउनलोड पूरा होने पर इंस्टॉलर चलाएँ। Windows सुरक्षा पुष्टि केवल तब जारी रखें जब आपने पुष्टि कर ली हो कि फ़ाइल आधिकारिक IGDC साइट से आई है।",guideAdditionalNotes:"डाउनलोड समय नेटवर्क के अनुसार बदल सकता है। Android/मोबाइल ऐप इस चरण में इस पृष्ठ पर वितरित नहीं किया जाता है। भविष्य का संस्करण उसी आधिकारिक डाउनलोड स्थान पर इंस्टॉलर को बदल सकता है। गैर-आधिकारिक लिंक से फ़ाइल डाउनलोड या चलाएँ नहीं।"},
  tr:{guideSteps:"1. IGDC Yardım ve İndirme Merkezini açın.\n2. MARU Media Player · Windows öğesinin yanındaki İndir düğmesine tıklayın ve maru-media-player-setup.exe dosyasını kaydedin.\n3. İndirme tamamlanınca yükleyiciyi çalıştırın. Windows güvenlik onayına yalnızca dosyanın resmi IGDC sitesinden geldiğini doğruladıktan sonra devam edin.",guideAdditionalNotes:"İndirme süresi ağa göre değişebilir. Android/mobil uygulama bu aşamada bu sayfada dağıtılmamaktadır. Gelecekteki bir sürüm yükleyiciyi aynı resmi indirme konumunda değiştirebilir. Resmi olmayan bağlantılardan dosya indirmeyin veya çalıştırmayın."},
  fa:{guideSteps:"1. مرکز راهنما و دانلود IGDC را باز کنید.\n2. کنار MARU Media Player · Windows روی دانلود بزنید و maru-media-player-setup.exe را ذخیره کنید.\n3. پس از پایان دانلود، نصب‌کننده را اجرا کنید. فقط پس از تأیید اینکه فایل از وب‌سایت رسمی IGDC دریافت شده است، تأیید امنیتی Windows را ادامه دهید.",guideAdditionalNotes:"زمان دانلود بسته به شبکه متفاوت است. برنامه Android/موبایل در این مرحله در این صفحه توزیع نمی‌شود. نسخه بعدی ممکن است فایل نصب را در همان محل رسمی دانلود جایگزین کند. فایل‌های پیوندهای غیررسمی را دانلود یا اجرا نکنید."},
  bn:{guideSteps:"1. IGDC সহায়তা ও ডাউনলোড কেন্দ্র খুলুন।\n2. MARU Media Player · Windows-এর পাশে ডাউনলোডে ক্লিক করে maru-media-player-setup.exe সংরক্ষণ করুন।\n3. ডাউনলোড শেষ হলে ইনস্টলার চালান। ফাইলটি IGDC-এর অফিসিয়াল সাইট থেকে এসেছে নিশ্চিত হওয়ার পরেই Windows নিরাপত্তা নিশ্চিতকরণ চালিয়ে যান।",guideAdditionalNotes:"নেটওয়ার্ক অনুযায়ী ডাউনলোড সময় ভিন্ন হতে পারে। এই পর্যায়ে Android/মোবাইল অ্যাপ এই পৃষ্ঠায় বিতরণ করা হয় না। ভবিষ্যৎ সংস্করণ একই অফিসিয়াল ডাউনলোড স্থানে ইনস্টলার প্রতিস্থাপন করতে পারে। অনানুষ্ঠানিক লিংক থেকে ফাইল ডাউনলোড বা চালাবেন না।"},
  ur:{guideSteps:"1. IGDC مدد اور ڈاؤن لوڈ سینٹر کھولیں۔\n2. MARU Media Player · Windows کے ساتھ ڈاؤن لوڈ دبائیں اور maru-media-player-setup.exe محفوظ کریں۔\n3. ڈاؤن لوڈ مکمل ہونے کے بعد انسٹالر چلائیں۔ Windows کی حفاظتی تصدیق صرف اس وقت جاری رکھیں جب فائل کے IGDC کی سرکاری ویب سائٹ سے آنے کی تصدیق ہو جائے۔",guideAdditionalNotes:"ڈاؤن لوڈ کا وقت نیٹ ورک کے مطابق مختلف ہو سکتا ہے۔ Android/موبائل ایپ اس مرحلے پر اس صفحے سے تقسیم نہیں کی جاتی۔ آئندہ ورژن اسی سرکاری ڈاؤن لوڈ مقام پر انسٹالر کو بدل سکتا ہے۔ غیر سرکاری روابط سے فائلیں ڈاؤن لوڈ یا چلائیں نہیں۔"},
  sw:{guideSteps:"1. Fungua Kituo cha Msaada na Upakuaji cha IGDC.\n2. Bofya Pakua karibu na MARU Media Player · Windows na uhifadhi maru-media-player-setup.exe.\n3. Endesha kisakinishi baada ya upakuaji kukamilika. Endelea na uthibitisho wa usalama wa Windows tu baada ya kuthibitisha kuwa faili imetoka kwenye tovuti rasmi ya IGDC.",guideAdditionalNotes:"Muda wa upakuaji unaweza kutofautiana kulingana na mtandao. Programu ya Android/simu haijasambazwa kwenye ukurasa huu kwa sasa. Toleo la baadaye linaweza kubadilisha kisakinishi katika eneo lilelile rasmi la upakuaji. Usipakue au kuendesha faili kutoka viungo visivyo rasmi."},
  ta:{guideSteps:"1. IGDC உதவி மற்றும் பதிவிறக்க மையத்தைத் திறக்கவும்.\n2. MARU Media Player · Windows அருகிலுள்ள பதிவிறக்கு பொத்தானை அழுத்தி maru-media-player-setup.exe கோப்பைச் சேமிக்கவும்.\n3. பதிவிறக்கம் முடிந்ததும் நிறுவியை இயக்கவும். கோப்பு அதிகாரப்பூர்வ IGDC தளத்திலிருந்து வந்தது என உறுதிப்படுத்திய பின்னரே Windows பாதுகாப்பு உறுதிப்படுத்தலைத் தொடரவும்.",guideAdditionalNotes:"பதிவிறக்க நேரம் வலையமைப்பைப் பொறுத்து மாறலாம். Android/மொபைல் பயன்பாடு இந்நிலையில் இந்தப் பக்கத்தில் விநியோகிக்கப்படவில்லை. எதிர்கால வெளியீடு அதே அதிகாரப்பூர்வ பதிவிறக்க இடத்தில் நிறுவியை மாற்றக்கூடும். அதிகாரப்பூர்வமற்ற இணைப்புகளிலிருந்து கோப்புகளை பதிவிறக்கவோ இயக்கவோ வேண்டாம்."},
  hu:{guideSteps:"1. Nyissa meg az IGDC súgó- és letöltőközpontját.\n2. Kattintson a Letöltés gombra a MARU Media Player · Windows mellett, és mentse a maru-media-player-setup.exe fájlt.\n3. A letöltés után futtassa a telepítőt. Windows biztonsági megerősítést csak akkor folytasson, ha ellenőrizte, hogy a fájl az IGDC hivatalos webhelyéről származik.",guideAdditionalNotes:"A letöltési idő a hálózattól függően eltérhet. Az Android/mobilalkalmazás jelenleg nem érhető el ezen az oldalon. Egy későbbi kiadás ugyanazon a hivatalos letöltési helyen lecserélheti a telepítőt. Ne töltsön le és ne futtasson fájlokat nem hivatalos hivatkozásokról."},
  ms:{guideSteps:"1. Buka Pusat Bantuan dan Muat Turun IGDC.\n2. Klik Muat turun di sebelah MARU Media Player · Windows dan simpan maru-media-player-setup.exe.\n3. Jalankan pemasang selepas muat turun selesai. Teruskan pengesahan keselamatan Windows hanya selepas mengesahkan fail datang daripada laman rasmi IGDC.",guideAdditionalNotes:"Masa muat turun mungkin berbeza mengikut rangkaian. Aplikasi Android/mudah alih tidak diedarkan pada halaman ini pada peringkat ini. Keluaran akan datang mungkin menggantikan pemasang di lokasi muat turun rasmi yang sama. Jangan muat turun atau jalankan fail daripada pautan tidak rasmi."},
  nl:{guideSteps:"1. Open het IGDC-help- en downloadcentrum.\n2. Klik op Downloaden naast MARU Media Player · Windows en sla maru-media-player-setup.exe op.\n3. Voer het installatieprogramma uit nadat de download is voltooid. Ga alleen verder met een Windows-beveiligingsbevestiging nadat u hebt gecontroleerd dat het bestand van de officiële IGDC-site komt.",guideAdditionalNotes:"De downloadtijd kan per netwerk verschillen. De Android/mobiele app wordt in deze fase niet op deze pagina verspreid. Een toekomstige versie kan het installatieprogramma op dezelfde officiële downloadlocatie vervangen. Download of voer geen bestanden uit via onofficiële links."},

const RTL = new Set(['ar','fa','ur']);
const LEGAL_OPERATOR_LOCAL_NAME = {
  zh:'国际综合商社',
  zht:'國際綜合商社',
  ja:'国際総合商社'
};
function getLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if(q && I18N[q]) return q;
    const saved = (localStorage.getItem('igdc_lang')||'').toLowerCase();
    if(saved && I18N[saved]) return saved;
    const doc = (document.documentElement.lang||'').toLowerCase();
    if(doc && I18N[doc]) return doc;
    const nav = (navigator.language||'').toLowerCase();
    if(nav === 'zh-tw' || nav === 'zh-hk' || nav === 'zh-hant') return 'zht';
    const base = nav.split(/[-_]/)[0];
    if(I18N[base]) return base;
  }catch(e){}
  return 'ko';
}
function fillText(id, text){ const el=document.getElementById(id); if(el) el.textContent=text||''; }
function fillList(id, arr){
  const el=document.getElementById(id); if(!el) return;
  el.innerHTML=''; (arr||[]).forEach(t=>{ const li=document.createElement('li'); li.textContent=t; el.appendChild(li); });
}
function render(lang){
  const t=I18N[lang]||I18N.ko;
  document.documentElement.lang=lang;
  document.body.classList.toggle('rtl', RTL.has(lang));
  document.title=t.title || 'IGDC Help';
  fillText('legalOperatorBrand', 'IGDC Global ('+(LEGAL_OPERATOR_LOCAL_NAME[lang]||'국제종합상사')+')');
  fillText('title', t.title);
  fillText('subtitle', t.subtitle);
  fillText('upgradeLine', t.upgradeLine);
  fillText('qnaLine', t.qnaLine);
  fillText('emailLabel', t.emailLabel);

  fillText('qnaAskTitle', t.qnaAskTitle);
  fillText('qnaAskText', t.qnaAskText);
  fillText('officialEmailNote', t.officialEmailNote);
  const qContact=document.getElementById('qnaContact'); if(qContact) qContact.placeholder=t.qnaContactPlaceholder||'';
  const qQuestion=document.getElementById('qnaQuestion'); if(qQuestion) qQuestion.placeholder=t.qnaQuestionPlaceholder||'';
  fillText('qnaSubmit', t.qnaSubmit);
  fillText('platformTitle', t.platform);
  fillText('platformText', t.platformText);
  fillText('accessTitle', t.access);
  fillList('accessItems', t.accessItems);
  fillText('paymentTitle', t.payment);
  fillList('paymentItems', t.paymentItems);
  fillText('commerceTitle', t.commerceTitle || (I18N.en && I18N.en.commerceTitle) || 'Marketplace notice');
  fillText('commerceText', t.commerceText || (I18N.en && I18N.en.commerceText) || 'IGDC provides a platform connection service. Please check each seller or provider terms for product transactions.');
  fillText('policyTitle', t.policy);
  fillText('policyText', t.policyText);
  fillText('downloadsTitle', t.downloads);
  fillText('downloadText', t.downloadText);
  fillText('downloadNotice', t.notice);
  const mediaPolicy=t.maruMediaPolicy || (I18N.en && I18N.en.maruMediaPolicy) || {};
  fillText('maruMediaPolicyTitle', mediaPolicy.title);
  fillText('maruMediaPolicyText', mediaPolicy.text);
  fillText('maruMediaTermsLink', mediaPolicy.terms);
  fillText('maruMediaPrivacyLink', mediaPolicy.privacy);
  fillText('maruMediaRefundLink', mediaPolicy.refund);
  const policyLang=encodeURIComponent(lang);
  const termsLink=document.getElementById('maruMediaTermsLink');
  const privacyLink=document.getElementById('maruMediaPrivacyLink');
  const refundLink=document.getElementById('maruMediaRefundLink');
  if(termsLink) termsLink.href='/terms?lang='+policyLang;
  if(privacyLink) privacyLink.href='/privacy?lang='+policyLang;
  if(refundLink) refundLink.href='/refund?lang='+policyLang;
  fillText('footer', t.footer);
  document.querySelectorAll('[data-i18n-btn]').forEach(a=>a.textContent=t.btnDownload||'Download');
}
render(getLang());
window.addEventListener('storage', e=>{ if(e.key==='igdc_lang' && I18N[e.newValue]) render(e.newValue); });
window.addEventListener('message', e=>{ try{ const lang=e.data && (e.data.lang || e.data.igdc_lang); if(lang && I18N[lang]) render(lang); }catch(_e){} });


(function(){
  const link=document.getElementById('supportAiEmailLink');
  const modal=document.getElementById('supportAiMailModal');
  const close=document.getElementById('supportAiMailClose');
  function openModal(ev){
    if(ev) ev.preventDefault();
    if(!modal) return false;
    modal.hidden=false;
    modal.setAttribute('aria-hidden','false');
    try{ const q=document.getElementById('qnaQuestion'); if(q) setTimeout(()=>q.focus(), 20); }catch(e){}
    return false;
  }
  function closeModal(){
    if(!modal) return;
    modal.hidden=true;
    modal.setAttribute('aria-hidden','true');
  }
  if(link) link.addEventListener('click', openModal);
  if(close) close.addEventListener('click', closeModal);
  if(modal) modal.addEventListener('click', function(e){ if(e.target===modal) closeModal(); });
  window.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });
})();

(function(){
  const btn=document.getElementById('qnaSubmit');
  const q=document.getElementById('qnaQuestion');
  const contact=document.getElementById('qnaContact');
  const status=document.getElementById('qnaStatus');
  const answerBox=document.getElementById('qnaAnswerBox');
  function currentText(){ return I18N[getLang()] || I18N.ko; }
  function setStatus(msg, show){ if(status){ status.textContent=msg||''; status.style.display=show?'inline-block':'none'; } }
  if(btn){
    btn.addEventListener('click', async function(){
      const t=currentText();
      const question=(q && q.value || '').trim();
      if(!question){ setStatus(t.qnaQuestionPlaceholder || 'Enter your question.', true); return; }
      btn.disabled=true; setStatus(t.qnaSending || 'Preparing...', true);
      if(answerBox){ answerBox.style.display='none'; answerBox.textContent=''; }
      try{
        const res=await fetch('/.netlify/functions/qa-proxy', {
          method:'POST', headers:{'Content-Type':'application/json'}, cache:'no-store',
          body:JSON.stringify({ question, lang:getLang(), source:'support.html', page:'support', meta:{ contact:(contact&&contact.value||'').trim(), href:location.href, userAgent:navigator.userAgent } })
        });
        const data=await res.json();
        if(!res.ok || !data || data.ok===false) throw new Error((data&&data.error)||('HTTP '+res.status));
        const note=data.admin_required ? ('\n\n' + (t.qnaAdminNote || 'Submitted for admin review.')) : '';
        if(answerBox){ answerBox.textContent=(t.qnaAnswerTitle || 'AI answer')+'\n\n'+(data.answer || '')+note; answerBox.style.display='block'; }
        setStatus('', false);
      }catch(e){ setStatus((t.qnaError || 'An error occurred.') + ' ' + (e && e.message ? e.message : ''), true); }
      finally{ btn.disabled=false; }
    });
  }
})();


(function(){
  const guideBtn = document.getElementById('igdcDownloadGuideBtn');
  if(!guideBtn) return;
  function safe(v){ return (v == null ? '' : String(v)); }
  function buildGuideText(){
    const t=I18N[getLang()] || I18N.en || I18N.ko;
    const en=I18N.en || {};
    const lines=[];
    lines.push(t.title || 'IGDC Help');
    lines.push('===================');
    lines.push('');
    lines.push('MARU Media Player · Windows');
    lines.push('');
    lines.push(t.downloadText || en.downloadText || '');
    lines.push('');
    lines.push(t.guideSteps || en.guideSteps || '');
    lines.push('');
    lines.push(t.notice || en.notice || '');
    lines.push('');
    lines.push(t.guideAdditionalNotes || en.guideAdditionalNotes || '');
    lines.push('');
    lines.push(t.officialEmailNote || en.officialEmailNote || '');
    lines.push('igdcplatform@gmail.com');
    lines.push('');
    return lines.join('\r\n');
  }

  guideBtn.addEventListener('click', function(ev){
    ev.preventDefault();
    const blob = new Blob([buildGuideText()], { type:'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'IGDC_DOWNLOAD_GUIDE.txt';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 500);
  });
})();
</script>

<script id="igdc-qa-config">
  (function () {
    // 1) 민감정보 없는 기본 설정
    const baseConfig = {
      url: (window.IGDC_ENV && window.IGDC_ENV.SUPABASE_URL) || "",
      project: "IGDC",
      pageId: null,
      aiEndpoint: null
    };

    // Supabase 환경을 SUPER_VARSAR에 적용하는 함수
    function applyConfig(env) {
      const url =
        (env && env.SUPABASE_URL) ||
        baseConfig.url;

      const anonKey =
        (env && env.SUPABASE_ANON_KEY) ||
        "";

      if (!anonKey) {
        console.warn("[IGDC] Supabase anonKey is not configured.");
      }

      window.SUPER_VARSAR = Object.assign(
        window.SUPER_VARSAR || {},
        baseConfig,
        {
          url: url,
          anonKey: anonKey
        }
      );
    }

    // 2) 이미 window.IGDC_ENV가 있다면(로컬 테스트 등) 그걸 우선 사용
    if (window.IGDC_ENV &&
        (window.IGDC_ENV.SUPABASE_ANON_KEY || window.IGDC_ENV.SUPABASE_URL)) {
      applyConfig(window.IGDC_ENV);
      return;
    }

    // 3) 없으면 Netlify Functions에서 환경변수 읽어오기
    var endpoint = "/.netlify/functions/secureEnvBridge?public=supabase";

    fetch(endpoint, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) {
          throw new Error("http " + res.status);
        }
        return res.json();
      })
      .then(function (data) {
        var env = data && (data.env || data);
        window.IGDC_ENV = Object.assign(window.IGDC_ENV || {}, env || {});
        applyConfig(window.IGDC_ENV);
        console.log("[IGDC] Supabase env loaded from secureEnvBridge.");
      })
      .catch(function (err) {
        console.warn("[IGDC] Failed to load Supabase env:", err && err.message);
        applyConfig(null);
      });
  })();
</script>

  Object.assign(SUPPORT_QA_UI_FALLBACK.fa, {note:'※ پرسش‌های ساده می‌توانند فوراً توسط AI پاسخ داده شوند. موارد فنی، خطا یا مسائل عملیاتی به Q&A مدیر ارسال می‌شوند.'});

  function qnaLang(){
    try{ if(typeof getLang === 'function') return getLang(); }catch(e){}
    try{ var s=(localStorage.getItem('igdc_lang')||'').toLowerCase(); if(s) return s; }catch(e){}
    try{ return (document.documentElement.lang||'ko').toLowerCase(); }catch(e){}
    return 'ko';
  }
  function qnaBaseText(){
    try{ var lang=qnaLang(); return (typeof I18N !== 'undefined' && (I18N[lang] || I18N.en || I18N.ko)) || {}; }catch(e){ return {}; }
  }
  function qnaFallbackText(){
    var lang=qnaLang();
    return SUPPORT_QA_UI_FALLBACK[lang] || SUPPORT_QA_UI_FALLBACK.en || SUPPORT_QA_UI_FALLBACK.ko || {};
  }
  function qnaText(key, fallback){
    var t=qnaBaseText();
    var f=qnaFallbackText();
    return (t && t[key]) || (f && f[key]) || fallback || key;
  }

  function getPageId(){ return (window.SUPER_VARSAR && window.SUPER_VARSAR.pageId) || (location.pathname + (location.hash||"")); }
  function getProject(){ return (window.SUPER_VARSAR && window.SUPER_VARSAR.project) || "IGDC"; }

  async function ensureSupabase(){
    if(STATE.sb) return STATE.sb;
    const url = window.SUPER_VARSAR && window.SUPER_VARSAR.url;
    const key = window.SUPER_VARSAR && window.SUPER_VARSAR.anonKey;
    if(!url || !key || !window.supabase || !window.supabase.createClient){
      console.warn("[Q&A] Supabase 자격/라이브러리 미설정: UI는 표시되지만 저장은 비활성화됩니다.");
      return null;
    }
    STATE.sb = window.supabase.createClient(url, key);
    return STATE.sb;
  }
  async function ensureAuth(){
    const sb = await ensureSupabase(); if(!sb) return;
    let { data: { session } } = await sb.auth.getSession();
    if(!session){
      try{ await sb.auth.signInAnonymously(); }catch(e){}
      ({ data: { session } } = await sb.auth.getSession());
    }
    if(session){
      const uid = session.user.id;
      const { data } = await sb.from("igdc_admins").select("uid").eq("uid", uid).limit(1);
      STATE.user = session.user;
      STATE.isAdmin = Array.isArray(data) && data.length>0;
    }
  }

  function mountUI(){
    const modal = el("div","igdc-qa-modal");
    const backdrop = el("div","igdc-qa-backdrop");
    const panel = el("div","igdc-qa-panel");
    const header = el("div","igdc-qa-header");
    const title = el("div","igdc-qa-title");
    const close = el("button","igdc-qa-close"); close.innerHTML="&#10005;";
    header.append(title, close);

    const body = el("div","igdc-qa-body");
    const lQ = el("label");
    const tQ = el("textarea","igdc-qa-text q");
    const lA = el("label");
    const tA = el("textarea","igdc-qa-text a");
    const actions = el("div","igdc-qa-actions");
    const btnSubmit = el("button","igdc-qa-btn primary");
    const btnClear = el("button","igdc-qa-btn muted");
    const note = el("div","igdc-qa-note");
    const list = el("div","igdc-qa-threads");

    function applyQaLanguage(){
      title.textContent = qnaText("qnaAskTitle", "Q&A");
      close.setAttribute("aria-label", qnaText("close", "Close"));
      lQ.textContent = qnaText("question", "Question");
      tQ.placeholder = qnaText("qnaQuestionPlaceholder", qnaText("question", "Question"));
      lA.textContent = qnaText("answer", "Answer");
      tA.placeholder = qnaText("answerPlaceholder", qnaText("qnaSending", "Please wait a moment."));
      btnSubmit.textContent = qnaText("qnaSubmit", "Submit");
      btnClear.textContent = qnaText("clear", "Clear");
      note.textContent = qnaText("note", qnaText("qnaAskText", "Simple questions can receive an immediate answer."));
    }
    applyQaLanguage();
    window.addEventListener("storage", function(e){ if(e.key === "igdc_lang") applyQaLanguage(); });
    window.addEventListener("message", function(e){ try{ if(e.data && (e.data.lang || e.data.igdc_lang)) setTimeout(applyQaLanguage, 0); }catch(_e){} });

    body.append(lQ,tQ,lA,tA,actions,note,list);
    actions.append(btnSubmit, btnClear);
    panel.append(header, body);
    modal.append(backdrop, panel);
    document.body.append(modal);

    // position near sidebar
    function positionNearSidebar(){
      try{
        const sb = document.querySelector('.sidebar');
        if(sb){
          const rect = sb.getBoundingClientRect();
          const left = Math.round(rect.right + 12);
          panel.style.left = left + "px";
        }
      }catch(e){}
    }
    positionNearSidebar();
    window.addEventListener('resize', positionNearSidebar);
    window.addEventListener('scroll', positionNearSidebar, { passive:true });

    function openModal(){
      if(isAnimating || isOpen) return;
      isAnimating = true;
      modal.style.display = "block";
      requestAnimationFrame(()=>{
        modal.classList.add('open');
        isOpen = true;
        setTimeout(()=>{ isAnimating = false; }, 220);
      });
    }
    function closeModal(){
      if(isAnimating || !isOpen) return;
      isAnimating = true;
      modal.classList.remove('open');
      setTimeout(()=>{
        modal.style.display = "none";
        isOpen = false;
        isAnimating = false;
      }, 220);
    }

    // Sidebar trigger
    const sideBtn = document.querySelector('#qnaOpenBtn');
    if(sideBtn){ sideBtn.addEventListener('click', openModal); }
    close.addEventListener("click", closeModal);
    backdrop.addEventListener("click", closeModal);
    document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeModal(); });

    btnClear.addEventListener("click", ()=>{ tQ.value=""; tA.value=""; });
    tQ.addEventListener("keydown", (e)=>{ if(e.key==="Enter" && e.ctrlKey){ e.preventDefault(); btnSubmit.click(); }});
    tA.addEventListener("keydown", (e)=>{ if(e.key==="Enter" && e.ctrlKey){ e.preventDefault(); btnSubmit.click(); }});

    async function fetchThreads(){
      const sb = await ensureSupabase(); if(!sb) return;
      const { data, error } = await sb.from("igdc_qna_threads")
        .select("*")
        .eq("project", STATE.project)
        .eq("page_id", STATE.pageId)
        .order("created_at", { ascending:false }).limit(100);
      if(error){ console.error(error); return; }
      renderList(data||[]);
    }
    function renderList(rows){
      list.innerHTML="";
      rows.forEach(row=>{
        const box = el("div","igdc-qa-thread");
        const q = el("div","igdc-qa-thread-q"); q.textContent="Q. "+(row.question||"");
        const a = el("div","igdc-qa-thread-a"); a.textContent=row.answer?("A. "+row.answer):("A. (" + qnaText("pending", "Pending") + ")");
        const meta = el("div","igdc-qa-thread-meta");
        const time = el("span"); time.textContent = new Date(row.created_at).toLocaleString();
        const tag = el("span"); tag.textContent = row.is_admin ? qnaText("admin", "Admin request") : qnaText("normal", "General");
        const actions = el("div","igdc-qa-thread-actions");
        const canDelete = (STATE.user && (row.user_id === STATE.user.id || STATE.isAdmin));
        if(canDelete){
          const del = el("button","igdc-qa-btn muted"); del.textContent=qnaText("delete", "Delete");
          del.addEventListener("click", async ()=>{
            const sb = await ensureSupabase(); if(!sb) return;
            const { error } = await sb.from("igdc_qna_threads").delete().eq("id", row.id);
            if(error){ alert(qnaText("deleteFail", "Delete failed.")); return; }
            await fetchThreads();
          });
          actions.append(del);
        }
        meta.append(time, tag, actions);
        box.append(q,a,meta);
        list.append(box);
      });
    }

    async function autoAnswerIfNeeded(text){
      const technical = classifyTech(text);
      let answer = null;
      if(!technical){
        const ep = getAIEndpoint();
        if(ep){
          try{
            const res = await fetch(ep,{method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({question:text, pageId: STATE.pageId})});
            const j = await res.json(); answer = j && (j.answer||j.text||null);
          }catch(e){}
        }
        if(!answer){
          if(/시간|운영시간|오픈|문의|hours|open|contact|support/i.test(text)) answer=qnaText("fallbackOps", "Operational inquiries will be reviewed by the administrator.");
          else if(/가격|비용|요금|price|cost|fee/i.test(text)) answer=qnaText("fallbackPrice", "Please refer to the page notice for price or fee details.");
          else answer=qnaText("fallbackThanks", "Thank you for your inquiry. We will review it quickly.");
        }
      }
      return { technical, answer };
    }

    async function submit(){
      const q = (tQ.value||"").trim();
      let a = (tA.value||"").trim();
      if(!q){ tQ.focus(); return; }
      const { technical, answer } = await autoAnswerIfNeeded(q);
      if(!a && answer) a = answer;
      const sb = await ensureSupabase();
      if(!sb){
        alert(qnaText("saveDisabled", "Server saving is currently disabled."));
        return;
      }
      const record = {
        project: STATE.project, page_id: STATE.pageId,
        user_id: (STATE.user && STATE.user.id) || null,
        question: q, answer: a || null, is_admin: technical,
        created_at: nowISO(), meta: { ua: navigator.userAgent||"", lang: navigator.language||"" }
      };
      const { error } = await sb.from("igdc_qna_threads").insert(record);
      if(error){ alert(qnaText("saveFail", "Submit failed")); return; }
      tQ.value=""; tA.value = a || "";
      await fetchThreads();
    }
    btnSubmit.addEventListener("click", submit);

    // realtime refresh
    (async()=>{ try{
      const sb = await ensureSupabase(); if(!sb) return;
      sb.channel('igdc_qna_changes').on('postgres_changes',{event:'*',schema:'public',table:'igdc_qna_threads'}, fetchThreads).subscribe();
    }catch(e){} })();

    window.IGDC_QA = { open: openModal, close: closeModal, refresh: ()=> fetchThreads() };
    fetchThreads();
  }

  async function boot(){
  window.SUPER_VARSAR = window.SUPER_VARSAR || {};
  STATE.project = (window.SUPER_VARSAR.project || "IGDC");
  STATE.pageId = (window.SUPER_VARSAR.pageId || (location.pathname + (location.hash||"")));
  // 1) Always mount UI so the popup can open
  mountUI();
  // 2) Then, try to init Supabase/auth asynchronously (non-blocking)
  try { await ensureAuth(); } catch(e){ console.warn("[Q&A] auth 초기화 실패:", e); }
}
if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", boot); } else { boot(); }
})();
</script>

if(typeof window.IGDC_QA.open!=="function"){
  window.IGDC_QA.open=function(){
    if(window.QnaCore&&typeof QnaCore.open==="function"){QnaCore.open();}
    else if(typeof openModal==="function"){openModal();}
  };
}
window.addEventListener("message",function(ev){
  try{if(ev&&ev.data&&ev.data.type==="IGTC_OPEN_QNA"&&typeof IGDC_QA.open==="function"){IGDC_QA.open();}}catch(e){}
});
</script>
