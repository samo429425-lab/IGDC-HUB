const EXTRA={"ko":{"commerceTitle":"상품 · 거래 책임 안내","commerceText":"IGDC는 상품, 콘텐츠, 서비스와 판매자·제공자를 연결하는 플랫폼입니다. IGDC가 직접 판매자로 명시된 경우를 제외하고, 상품 상세, 가격, 배송, 환불, 이용 조건과 거래 이행 책임은 해당 판매자 또는 제공자와 이용자 사이의 조건을 우선 확인해야 합니다."},"en":{"commerceTitle":"Product and transaction responsibility notice","commerceText":"IGDC provides a platform that connects products, content, services, sellers, and providers. Unless IGDC is clearly stated as the direct seller, item details, pricing, delivery, refund terms, usage conditions, and transaction performance should be checked with the seller or provider."},"zh":{"commerceTitle":"商品与交易责任说明","commerceText":"IGDC 是连接商品、内容、服务、卖家和提供者的平台。除非明确标注 IGDC 为直接卖家，否则商品详情、价格、配送、退款、使用条件和交易履行责任应优先与卖家或提供者确认。"},"zht":{"commerceTitle":"商品與交易責任說明","commerceText":"IGDC 是連接商品、內容、服務、賣家與提供者的平台。除非明確標示 IGDC 為直接賣家，商品詳情、價格、配送、退款、使用條件與交易履行責任應優先與賣家或提供者確認。"},"ja":{"commerceTitle":"商品・取引責任に関する案内","commerceText":"IGDCは商品、コンテンツ、サービス、販売者および提供者をつなぐプラットフォームです。IGDCが直接販売者と明示される場合を除き、商品詳細、価格、配送、返金、利用条件、取引履行責任は販売者または提供者との条件を確認してください。"},"es":{"commerceTitle":"Aviso sobre productos y transacciones","commerceText":"IGDC ofrece una plataforma que conecta productos, contenidos, servicios, vendedores y proveedores. Salvo que IGDC figure como vendedor directo, los detalles, precios, entrega, reembolsos, condiciones y cumplimiento deben verificarse con el vendedor o proveedor."},"fr":{"commerceTitle":"Avis sur les produits et transactions","commerceText":"IGDC fournit une plateforme reliant produits, contenus, services, vendeurs et fournisseurs. Sauf si IGDC est indiqué comme vendeur direct, les détails, prix, livraison, remboursements, conditions et exécution doivent être vérifiés avec le vendeur ou fournisseur."},"de":{"commerceTitle":"Hinweis zu Produkten und Transaktionen","commerceText":"IGDC stellt eine Plattform bereit, die Produkte, Inhalte, Dienste, Verkäufer und Anbieter verbindet. Sofern IGDC nicht als direkter Verkäufer genannt ist, sind Details, Preise, Lieferung, Erstattung, Bedingungen und Erfüllung mit Verkäufer oder Anbieter zu prüfen."},"ru":{"commerceTitle":"Уведомление о товарах и сделках","commerceText":"IGDC предоставляет платформу, соединяющую товары, контент, услуги, продавцов и поставщиков. Если IGDC не указан прямым продавцом, детали, цены, доставка, возврат, условия и исполнение проверяются с продавцом или поставщиком."},"pt":{"commerceTitle":"Aviso sobre produtos e transações","commerceText":"A IGDC fornece uma plataforma que conecta produtos, conteúdos, serviços, vendedores e fornecedores. Salvo indicação de venda direta pela IGDC, detalhes, preço, entrega, reembolso, condições e execução devem ser verificados com o vendedor ou fornecedor."},"it":{"commerceTitle":"Avviso su prodotti e transazioni","commerceText":"IGDC offre una piattaforma che collega prodotti, contenuti, servizi, venditori e fornitori. Salvo indicazione di vendita diretta da parte di IGDC, dettagli, prezzo, consegna, rimborso, condizioni e adempimento vanno verificati con venditore o fornitore."},"ar":{"commerceTitle":"إشعار مسؤولية المنتجات والمعاملات","commerceText":"توفر IGDC منصة تربط المنتجات والمحتوى والخدمات والبائعين ومقدمي الخدمة. ما لم تُذكر IGDC كبائع مباشر، يجب التحقق من التفاصيل والسعر والتسليم والاسترداد والشروط ومسؤولية التنفيذ مع البائع أو المزود."},"vi":{"commerceTitle":"Thông báo trách nhiệm sản phẩm và giao dịch","commerceText":"IGDC là nền tảng kết nối sản phẩm, nội dung, dịch vụ, người bán và nhà cung cấp. Trừ khi IGDC được nêu rõ là người bán trực tiếp, chi tiết, giá, giao hàng, hoàn tiền, điều kiện sử dụng và trách nhiệm giao dịch cần kiểm tra với người bán hoặc nhà cung cấp."},"th":{"commerceTitle":"ประกาศความรับผิดชอบสินค้าและธุรกรรม","commerceText":""},"id":{"commerceTitle":"Pemberitahuan tanggung jawab produk dan transaksi","commerceText":"IGDC menyediakan platform yang menghubungkan produk, konten, layanan, penjual, dan penyedia. Kecuali IGDC dinyatakan sebagai penjual langsung, detail, harga, pengiriman, pengembalian dana, syarat penggunaan, dan pelaksanaan transaksi harus diperiksa dengan penjual atau penyedia."},"hi":{"commerceTitle":"उत्पाद और लेन-देन जिम्मेदारी सूचना","commerceText":""},"tr":{"commerceTitle":"Ürün ve işlem sorumluluğu bildirimi","commerceText":"IGDC ürünleri, içerikleri, hizmetleri, satıcıları ve sağlayıcıları bağlayan bir platformdur. IGDC doğrudan satıcı olarak belirtilmedikçe ürün detayı, fiyat, teslimat, iade, kullanım koşulları ve işlem sorumluluğu satıcı veya sağlayıcı ile kontrol edilmelidir."},"fa":{"commerceTitle":"اطلاعیه مسئولیت محصول و معامله","commerceText":"IGDC بستری برای اتصال محصولات، محتوا، خدمات، فروشندگان و ارائه‌دهندگان است. مگر اینکه IGDC صراحتاً فروشنده مستقیم باشد، جزئیات، قیمت، تحویل، بازپرداخت، شرایط استفاده و مسئولیت انجام معامله باید با فروشنده یا ارائه‌دهنده بررسی شود."},"bn":{"commerceTitle":"পণ্য ও লেনদেন দায়িত্ব সংক্রান্ত নোটিশ","commerceText":""},"ur":{"commerceTitle":"مصنوعات اور لین دین کی ذمہ داری کا نوٹس","commerceText":""},"sw":{"commerceTitle":"Taarifa ya wajibu wa bidhaa na miamala","commerceText":"IGDC ni jukwaa linalounganisha bidhaa, maudhui, huduma, wauzaji na watoa huduma. Isipokuwa IGDC imeelezwa kuwa muuzaji wa moja kwa moja, maelezo, bei, usafirishaji, marejesho, masharti na utekelezaji wa muamala uthibitishwe na muuzaji au mtoa huduma."},"ta":{"commerceTitle":"தயாரிப்பு மற்றும் பரிவர்த்தனை பொறுப்பு அறிவிப்பு","commerceText":"IGDC தயாரிப்புகள், உள்ளடக்கம், சேவைகள், விற்பனையாளர்கள் மற்றும் வழங்குநர்களை இணைக்கும் தளம். IGDC நேரடி விற்பனையாளராக தெளிவாக குறிப்பிடப்படாவிட்டால், விவரம், விலை, விநியோகம், பணத்தைத் திரும்பப் பெறுதல், நிபந்தனைகள் மற்றும் பரிவர்த்தனை பொறுப்பு விற்பனையாளர் அல்லது வழங்குநருடன் உறுதிப்படுத்தப்பட வேண்டும்."},"hu":{"commerceTitle":"Termék- és tranzakciós felelősségi tájékoztató","commerceText":"Az IGDC platformként termékeket, tartalmakat, szolgáltatásokat, eladókat és szolgáltatókat kapcsol össze. Hacsak az IGDC nincs közvetlen eladóként megjelölve, a részleteket, árat, szállítást, visszatérítést, feltételeket és teljesítést az eladóval vagy szolgáltatóval kell ellenőrizni."},"ms":{"commerceTitle":"Notis tanggungjawab produk dan transaksi","commerceText":"IGDC ialah platform yang menghubungkan produk, kandungan, perkhidmatan, penjual dan penyedia. Melainkan IGDC dinyatakan sebagai penjual langsung, butiran, harga, penghantaran, bayaran balik, syarat dan pelaksanaan transaksi perlu disemak dengan penjual atau penyedia."},"nl":{"commerceTitle":"Kennisgeving product- en transactieverantwoordelijkheid","commerceText":"IGDC biedt een platform dat producten, content, diensten, verkopers en aanbieders verbindt. Tenzij IGDC als directe verkoper is vermeld, moeten details, prijs, levering, terugbetaling, voorwaarden en uitvoering met verkoper of aanbieder worden gecontroleerd."},"pl":{"commerceTitle":"Informacja o odpowiedzialności za produkty i transakcje","commerceText":"IGDC zapewnia platformę łączącą produkty, treści, usługi, sprzedawców i dostawców. O ile IGDC nie jest wyraźnie wskazany jako bezpośredni sprzedawca, szczegóły, cena, dostawa, zwroty, warunki i realizacja powinny być sprawdzone u sprzedawcy lub dostawcy."},"sv":{"commerceTitle":"Meddelande om produkt- och transaktionsansvar","commerceText":"IGDC tillhandahåller en plattform som kopplar samman produkter, innehåll, tjänster, säljare och leverantörer. Om IGDC inte anges som direkt säljare ska detaljer, pris, leverans, återbetalning, villkor och transaktionsansvar kontrolleras med säljaren eller leverantören."},"tl":{"commerceTitle":"Paunawa sa responsibilidad ng produkto at transaksyon","commerceText":"Ang IGDC ay platform na nag-uugnay ng produkto, content, serbisyo, seller at provider. Maliban kung malinaw na direktang seller ang IGDC, dapat suriin sa seller o provider ang detalye, presyo, delivery, refund, terms at pagtupad ng transaksyon."},"uk":{"commerceTitle":"Повідомлення про відповідальність за товари й транзакції","commerceText":"IGDC є платформою, що з’єднує товари, контент, послуги, продавців і постачальників. Якщо IGDC не зазначений як прямий продавець, деталі, ціна, доставка, повернення, умови та виконання мають перевірятися з продавцем або постачальником."},"uz":{"commerceTitle":"Mahsulot va tranzaksiya javobgarligi haqida xabar","commerceText":"IGDC mahsulotlar, kontent, xizmatlar, sotuvchilar va ta’minotchilarni bog‘lovchi platformadir. IGDC bevosita sotuvchi sifatida ko‘rsatilmagan bo‘lsa, tafsilot, narx, yetkazib berish, qaytarish, shartlar va bitim bajarilishi sotuvchi yoki ta’minotchi bilan tekshirilishi kerak."}};
