 function detectPreferredLang(){
  try{
    const supported = Object.keys(pageMap || {});
    const langs = (navigator.languages && navigator.languages.length)
      ? navigator.languages
      : [navigator.language || ""];

    for (const raw of langs) {
      const code = String(raw || "").trim().toLowerCase();
      if (!code) continue;

      // Traditional Chinese first
      if (
        code === "zht" ||
        code === "zh-hant" || code === "zh_hant" ||
        code === "zh-tw"   || code === "zh_tw"   ||
        code === "zh-hk"   || code === "zh_hk"   ||
        code === "zh-mo"   || code === "zh_mo"
      ) return "zht";

      // Simplified / generic Chinese
      if (
        code === "zh-hans" || code === "zh_hans" ||
        code === "zh-cn"   || code === "zh_cn"   ||
        code === "zh-sg"   || code === "zh_sg"   ||
        code === "zh"
      ) return "zh";

      if (code.startsWith("pt")) return "pt";
      if (code.startsWith("ar")) return "ar";

      const base = code.split(/[-_]/)[0];
      if (supported.includes(base)) return base;
    }

    return "ko";
  } catch(e){
    return "ko";
  }
}

function detectPublicRoute() {
  try {
    const pathname = (location.pathname || '/').replace(/\/$/, '') || '/';
    if (pathname === '/admin') return { lang: null, index: 7 };
    if (pathname === '/help') return { lang: null, index: 8 };
    const languages = Object.keys(pageMap || {});
    for (const lang of languages) {
      const pages = pageMap[lang] || [];
      // Only the seven public front pages have language-specific route paths.
      for (let index = 0; index < pages.length; index++) {
        if (publicPageHref(pages[index], index) === pathname) {
          return { lang, index };
        }
      }
    }
  } catch(e) {}
  return null;
}

let currentLang = (function () {
  try {
    const queryLang = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
    if (queryLang && pageMap[queryLang]) return queryLang;

    const publicRoute = detectPublicRoute();
    if (publicRoute && pageMap[publicRoute.lang]) return publicRoute.lang;

    const saved = (localStorage.getItem('igdc_lang') || '').toLowerCase();
    if (saved && pageMap[saved]) return saved;

    const docLang = (document.documentElement.lang || '').toLowerCase();
    if (docLang && pageMap[docLang]) return docLang;

    return detectPreferredLang();
  } catch(e){
    return detectPreferredLang();
  }
})();

let currentPageIndex = (function () {
  const publicRoute = detectPublicRoute();
  return publicRoute ? publicRoute.index : 0;
})();

function withLanguage(href, lang) {
  try{
    var url = new URL(href, location.origin);
    url.searchParams.set('lang', lang || currentLang || 'ko');
    return url.pathname + url.search + url.hash;
  }catch(e){
    return href;
  }
}

function policyPageHref(value) {
  try{
    var pathname = new URL(value || '', location.origin).pathname.toLowerCase();
    var name = pathname.split('/').pop().replace(/\.html?$/i, '');
    if (name === 'terms' || name === 'maru-windows-terms') return '/terms';
    if (name === 'privacy' || name === 'maru-windows-privacy') return '/privacy';
    if (name === 'refund' || name === 'maru-windows-refund') return '/refund';
  }catch(e){}
  return '';
}

function renderIndexLanguage(lang) {
  const nextLang =
    (lang && pageMap[lang]) ? lang :
    (currentLang && pageMap[currentLang]) ? currentLang :
    detectPreferredLang();

  currentLang = nextLang || "ko";

  try { localStorage.setItem('igdc_lang', currentLang); } catch(e){}
  if (document.documentElement) {
    document.documentElement.setAttribute('lang', currentLang);
  }

  try{
    var sel = document.querySelector('.language-select');
    if (sel) sel.value = currentLang;
  }catch(e){}

  // 1) Title/subtitle
  try{
    var tt =
      (titleText && titleText[currentLang]) ||
      (titleText && titleText[detectPreferredLang()]) ||
      (titleText && titleText['ko']) ||
      {};

    var mt = document.getElementById('mainTitle');
    var st = document.getElementById('subTitle');

    if (mt) mt.textContent = tt.title || '';
    if (st) st.textContent = tt.subtitle || '';
  }catch(e){}

  // 2) Nav labels
  try{
    var navLinks = document.querySelectorAll('nav a');
    var src =
      (menuText && menuText[currentLang]) ||
      (menuText && menuText[detectPreferredLang()]) ||
      (menuText && menuText['ko']) ||
      [];

    if (Array.isArray(src) && src.length && Array.isArray(src[0])) {
      src = src[0];
    }

    navLinks.forEach(function(a, i){
      if (src[i] != null) a.textContent = src[i];
      if (pageMap[currentLang] && pageMap[currentLang][i]) {
        a.setAttribute('href', withLanguage(publicPageHref(pageMap[currentLang][i], i), currentLang));
      }
    });
  }catch(e){}

  return currentLang;
}

function changeLanguage(lang) {
  renderIndexLanguage(lang);

  // 3) Keep current page index, map to page, set iframe
  try{
    var pageList =
      (pageMap && pageMap[currentLang]) ||
      (pageMap && pageMap[detectPreferredLang()]) ||
      (pageMap && pageMap['ko']) ||
      [];

    var f = document.getElementById('mainFrame');
    var currentPolicy = '';
    try{
      var currentFrameHref = (f && f.contentWindow && f.contentWindow.location)
        ? f.contentWindow.location.href
        : (f ? f.getAttribute('src') : '');
      currentPolicy = policyPageHref(currentFrameHref);
    }catch(e){
      currentPolicy = policyPageHref(f ? f.getAttribute('src') : '');
    }

    var frameTarget;
    var publicTarget;
    var stateIndex = currentPageIndex;
    if (currentPolicy) {
      frameTarget = withLanguage(currentPolicy, currentLang);
      publicTarget = frameTarget;
      stateIndex = -1;
    } else {
      var page =
        pageList[currentPageIndex] ||
        (pageMap['ko'] && pageMap['ko'][currentPageIndex]) ||
        'home.html';
      frameTarget = withLanguage(framePageSrc(page), currentLang);
      publicTarget = withLanguage(publicPageHref(page, currentPageIndex), currentLang);
    }

    if (!/\/callback\.html$/i.test(location.pathname)) {
      history.replaceState({igdcPage:stateIndex, lang:currentLang, frameSrc:frameTarget}, '', publicTarget);
    }
    restoreFrameWithoutHistory(frameTarget);
  }catch(e){}
}

function publicPageHref(page, index){
  if (index === 8) return '/help';
  if (index === 7) return '/admin';
  var clean = String(page || 'home.html').replace(/^\/+/, '').replace(/\.html(?=([?#]|$))/i, '');
  return '/' + clean;
}

function framePageSrc(page){
  return '/' + String(page || 'home.html').replace(/^\/+/, '');
}

function restoreFrameWithoutHistory(src){
  try{
    var f = document.getElementById('mainFrame');
    if (!f || !src) return;
    var target = new URL(src, location.origin);
    var targetKey = target.pathname + target.search + target.hash;
    var now = Date.now();
    try{
      var live = new URL(f.contentWindow.location.href, location.origin);
      if (live.pathname + live.search + live.hash === targetKey) {
        f.__igdcPendingSrc = '';
        f.__igdcPendingAt = 0;
        return;
      }
    }catch(e){}
    if (f.__igdcPendingSrc === targetKey && now - (f.__igdcPendingAt || 0) < 8000) return;
    if (!f.__igdcPendingGuardBound) {
      f.__igdcPendingGuardBound = true;
      f.addEventListener('load', function(){
        try{
          if (!f.__igdcPendingSrc) return;
          var loaded = new URL(f.contentWindow.location.href, location.origin);
          if (loaded.pathname + loaded.search + loaded.hash === f.__igdcPendingSrc) {
            f.__igdcPendingSrc = '';
            f.__igdcPendingAt = 0;
          }
        }catch(e){}
      });
    }
    f.__igdcPendingSrc = targetKey;
    f.__igdcPendingAt = now;
    try{
      f.contentWindow.location.replace(targetKey);
      return;
    }catch(e){}
    f.src = targetKey;
  }catch(e){}
}

function navigatePolicyFromFrame(href){
  try{
    var policyPath = policyPageHref(href);
    if (!policyPath) return false;
    var source = new URL(href, location.origin);
    var requestedLang = (source.searchParams.get('lang') || '').toLowerCase();
    var lang = (requestedLang && pageMap[requestedLang]) ? requestedLang : currentLang;
    var target = withLanguage(policyPath, lang);
    var currentUrl = location.pathname + location.search + location.hash;
    currentLang = lang;
    if (target !== currentUrl) {
      history.pushState({igdcPage:-1, lang:lang, frameSrc:target}, '', target);
    }
    restoreFrameWithoutHistory(target);
    return false;
  }catch(e){
    return false;
  }
}

function loadPage(index, event, options){
  if (event && typeof event.preventDefault === 'function') event.preventDefault();
  let pageList =
    pageMap[currentLang] ||
    pageMap[detectPreferredLang()] ||
    pageMap["ko"];

  let page =
    pageList[index] ||
    (pageMap["ko"] && pageMap["ko"][index]) ||
    "home.html";

  try{
    var role = (window.__IGDC_ROLE || "guest").toLowerCase();
    var isAdminLike =
      role === "admin" ||
      role.startsWith("admin_") ||
      role === "owner" ||
      role.startsWith("owner_");

    // Admin page is gated by destination, not by nav order.
    // Help/support is public and must not be blocked by the old 8th-link rule.
    if (/admin\.html(?:$|[?#])/i.test(String(page || "")) && !isAdminLike) {
      return false;
    }
  }catch(e){}

  currentPageIndex = index;
  var frameTarget = withLanguage(framePageSrc(page), currentLang);
  var publicTarget = withLanguage(publicPageHref(page, index), currentLang);
  try{
    if (!(options && options.skipHistory)) {
      var currentUrl = location.pathname + location.search + location.hash;
      if (publicTarget !== currentUrl) {
        history.pushState({igdcPage:index, lang:currentLang, frameSrc:frameTarget}, "", publicTarget);
      }
    }
  }catch(e){}
  restoreFrameWithoutHistory(frameTarget);
  return false;
}

window.addEventListener('popstate', function(ev){
  try{
    var route = detectPublicRoute();
    var queryLang = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
    var restoredLang =
      (ev.state && ev.state.lang && pageMap[ev.state.lang]) ? ev.state.lang :
      (queryLang && pageMap[queryLang]) ? queryLang :
      (route && route.lang && pageMap[route.lang]) ? route.lang :
      currentLang;

    // Browser back/forward changes the URL without firing the language picker.
    // Restore the index title, picker and navigation before restoring the frame.
    renderIndexLanguage(restoredLang);

    if (ev.state && ev.state.frameSrc) {
      if (Number.isInteger(ev.state.igdcPage) && ev.state.igdcPage >= 0) currentPageIndex = ev.state.igdcPage;
      restoreFrameWithoutHistory(ev.state.frameSrc);
      return;
    }
    var idx = ev.state && Number.isInteger(ev.state.igdcPage)
      ? ev.state.igdcPage
      : (route && Number.isInteger(route.index) ? route.index : 0);
    loadPage(idx, null, {skipHistory:true});
  }catch(e){}
});
</script>
  
<script>
(function(){
  var waitingForAuthRestore = false;

  function applyBootstrapLang(){
    try{
      // URL 언어 우선, 없으면 저장값과 위 detect 결과(currentLang) 순서로 적용
      var queryLang = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
      var saved = localStorage.getItem('igdc_lang');
      var bootstrapLang = (queryLang && pageMap[queryLang]) ? queryLang : saved;
      if (bootstrapLang && pageMap[bootstrapLang]){
        currentLang = bootstrapLang;
        document.documentElement.setAttribute('lang', bootstrapLang);
      }
      // 드롭다운 동기화
      var sel = document.querySelector('.language-select');
      if (sel) sel.value = currentLang;
      // 라벨/타이틀/iframe 적용
      if (typeof changeLanguage === 'function'){ changeLanguage(currentLang); }
    }catch(e){}
  }

  function bootstrapLang(){
    try{
      var restore = window.__IGDC_AUTH_RESTORE_PROMISE__;
      if (!window.__IGDC_AUTH_RESTORE_DONE__ && restore && typeof restore.then === 'function') {
        if (waitingForAuthRestore) return;
        waitingForAuthRestore = true;
        Promise.resolve(restore).catch(function(){}).then(function(){
          waitingForAuthRestore = false;
          applyBootstrapLang();
        });
        return;
      }
    }catch(e){}
    applyBootstrapLang();
  }
  document.addEventListener('DOMContentLoaded', bootstrapLang);
  document.addEventListener('osauth:ready', bootstrapLang);
  document.addEventListener('osauth:done', bootstrapLang, true);
})();
</script>

<script>
  (function(){
    // Debounce resize to reduce "jumping"
    let raf = 0;
    const onResize = () => {
      if(raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(()=>{
        document.dispatchEvent(new CustomEvent("IGDC_RESIZED"));
      });
    };
    window.addEventListener("resize", onResize);
    // Attach scroll controls to each horizontal list (data-hscroll)
    function attachButtons(){
      document.querySelectorAll("[data-hscroll]").forEach((row, idx)=>{
        let left = row.querySelector(".igdc-scroll-left");
        let right = row.querySelector(".igdc-scroll-right");
        if(!left){
          left = document.createElement("button");
          left.className = "igdc-scroll-left"; left.title = "왼쪽";
          left.innerHTML = "◀";
          document.body.appendChild(left);
          left.addEventListener("click", ()=> row.scrollBy({ left: -Math.max(240, row.clientWidth*0.8), behavior: "smooth" }));
        }
        if(!right){
          right = document.createElement("button");
          right.className = "igdc-scroll-right"; right.title = "오른쪽";
          right.innerHTML = "▶";
          document.body.appendChild(right);
          right.addEventListener("click", ()=> row.scrollBy({ left: Math.max(240, row.clientWidth*0.8), behavior: "smooth" }));
        }
      });
    }
    document.addEventListener("DOMContentLoaded", attachButtons);
    document.addEventListener("IGDC_RESIZED", ()=>{/* no-op, fixed buttons already pinned */});
  })();
</script>
<script id="igdc-intl-helper">
// Minimal Intl helpers (non-intrusive)
(function(){
  if (window.IGDCIntl) return;
  function safeLocale(loc){ try{ return (loc||document.documentElement.lang||'en'); }catch(e){ return 'en'; } }
  window.IGDCIntl = {
    date(d, locale, opts){
      try{
        var dt = (d instanceof Date) ? d : new Date(d);
        return new Intl.DateTimeFormat(safeLocale(locale), Object.assign({ year:'numeric', month:'short', day:'2-digit' }, opts||{})).format(dt);
      }catch(e){ return String(d); }
    },
    number(n, locale, opts){
      try{ return new Intl.NumberFormat(safeLocale(locale), opts||{}).format(n); }catch(e){ return String(n); }
    },
    currency(n, currency, locale, opts){
      try{
        var o = Object.assign({ style:'currency', currency: currency||'USD', maximumFractionDigits:2 }, opts||{});
        return new Intl.NumberFormat(safeLocale(locale), o).format(n);
      }catch(e){ return String(n); }
    }
  };
})();
</script>

<script id="authbar-pin-v4-js">
(function(){
  function $(q){ return document.querySelector(q); }
  function byId(id){ return document.getElementById(id); }
  function px(n){ return Math.round(n) + 'px'; }
  function inHeader(el){
    var hdr = $('header'); if (!hdr || !el) return null;
    if (!hdr.contains(el)) hdr.insertBefore(el, hdr.firstChild);
    return hdr;
  }
  function lockLogin(){
    var login = byId('osLoginBtn'); if (!login) return null;
    var hdr = inHeader(login); if (!hdr) return null;
    // Preserve current visual spot relative to header
    var hb = hdr.getBoundingClientRect();
    var lb = login.getBoundingClientRect();
    login.style.position = 'absolute';
    login.style.left = px(Math.max(0, Math.round(lb.left - hb.left)));
    login.style.top  = px(Math.max(0, Math.round(lb.top  - hb.top )));
    return {hdr, rect:{left:lb.left-hb.left, top:lb.top-hb.top, width:lb.width, height:lb.height}};
  }
  function lockRole(loginInfo){
    var role = byId('igtcRoleInline3'); if (!role) return;
    var hdr = inHeader(role); if (!hdr) return;
    // Force inline override to beat any prior CSS (including injected roleStatusBtn-style)
    role.style.position = 'absolute';
    // Align flush to login's right edge (0px gap)
    var L = loginInfo && loginInfo.rect;
    if (L){
      role.style.left = px(Math.max(0, Math.round(L.left + L.width + 0)));
      role.style.top  = px(Math.max(0, Math.round(L.top)));
    } else {
      // Fallback: keep its current spot but absolute within header
      var hb = hdr.getBoundingClientRect();
      var rb = role.getBoundingClientRect();
      role.style.left = px(Math.max(0, Math.round(rb.left - hb.left)));
      role.style.top  = px(Math.max(0, Math.round(rb.top  - hb.top )));
    }
  }
  function run(){
    try{
      var info = lockLogin();
      lockRole(info);
    }catch(e){}
  }
  if (document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', run, { once:true }); } else { run(); }
  // Keep consistent even if other scripts re-style or rename (#igtcRoleInline3 -> #roleStatusBtn)
  window.addEventListener('resize', function(){ requestAnimationFrame(run); });
  try{ new MutationObserver(function(){ run(); }).observe(document.documentElement, { childList:true, subtree:true }); }catch(_){}
})();
</script>

(function(){

  function placeToastUnderLogin(){
    const toast = document.getElementById('os-toast');

    if(!toast || !btn) return;

    const docY = window.scrollY || document.documentElement.scrollTop || 0;
    const docX = window.scrollX || document.documentElement.scrollLeft || 0;
    toast.style.top  = (rect.bottom + 8 + docY) + 'px';
    toast.style.left = (rect.left + rect.width/2 + docX) + 'px';
    toast.style.transform = 'translateX(-50%)';
  }
  function showToast(msg, ms=2200){
    const el = document.getElementById('os-toast'); if(!el) return;
    el.textContent = msg;
    placeToastUnderLogin();
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(()=>{ el.style.display='none'; }, ms);
  }
  window.addEventListener('resize', placeToastUnderLogin);
  window.addEventListener('scroll', placeToastUnderLogin, { passive:true });

  // Modal confirm
  function confirmLogout(){
    return new Promise(resolve => {
      const mask = document.getElementById('os-modal-mask');
      const box  = document.getElementById('os-modal');
      const ok   = document.getElementById('os-modal-ok');
      const no   = document.getElementById('os-modal-cancel');
      const off = () => { mask.style.display='none'; box.style.display='none'; ok.onclick=no.onclick=null; };
      mask.style.display='block'; box.style.display='block';
      ok.onclick = () => { off(); resolve(true); };
      no.onclick = () => { off(); resolve(false); };
      mask.onclick = no.onclick;
    });
  }

  // Token helpers (support window.osAuth or window.osauth or localStorage)
  function getIdToken(){
    try{
      if (window.osAuth && typeof window.osAuth.getIdToken === 'function') return window.osAuth.getIdToken();
      if (window.osAuth && typeof window.osAuth.getIdTokenPayload === 'function'){
        // some libs only expose payload
        return null;
      }
      if (window.osauth && window.osauth.id_token) return window.osauth.id_token;
      const ls = localStorage.getItem('id_token') || localStorage.getItem('os_id_token');
      if (ls) return ls;
    }catch(_){}
    return null;
  }
  function getIdPayload(){
    try{
      if (window.osAuth && typeof window.osAuth.getIdTokenPayload === 'function'){
        return window.osAuth.getIdTokenPayload();
      }
      const t = getIdToken();
      if (!t) return null;
      return JSON.parse(atob(t.split('.')[1]));
    }catch(_){ return null; }
  }
  function getRolesFromPayload(pay){
    const out = new Set();
    if (!pay) return out;
    for (const key of ROLE_KEYS){
      const v = pay[key];
      if (Array.isArray(v)) v.forEach(r=>out.add(String(r).toLowerCase()));
      else if (typeof v === 'string') v.split(',').forEach(r=>out.add(r.trim().toLowerCase()));

  function applyGate(){
    const authed = isAuthed();
    const adminOK = authed && isAdmin();
    // Admin menu by data-role
    document.querySelectorAll('[data-role~="admin"]').forEach(el => {
      el.style.display = adminOK ? '' : 'none';
    });

  }

  document.addEventListener('osauth:ready', function(){
    applyGate();

    document.addEventListener('DOMContentLoaded', applyGate);
  } else { applyGate(); }

    setTimeout(()=>location.reload(), 600);
  }, true);

  }catch(_){}

<!-- IGDC Pinset Patch: language persist + double-reload guard (non-destructive) -->
<script>
(function(){
  // ===== 1) Language persist (save & restore) =====
  var LANG_KEY = "igdc_lang";
  function q(sel){ try{ return document.querySelector(sel); } catch(_) { return null; } }
  function getPicker(){ return q(".language-select"); }
  function detectPref(){
    var sel = getPicker();
    if(sel && sel.value) return sel.value;
    var htmlLang = (document.documentElement && document.documentElement.lang)||"";
    if(htmlLang) return htmlLang;
    try { return (navigator.language || "en").split("-")[0]; } catch(_) { return "en"; }
  }
  function applyLang(lang){
    if(!lang) return;
    try{
      var sel = getPicker(); if(sel) sel.value = lang;
      if(document.documentElement) document.documentElement.setAttribute("lang", lang);
      // Prefer IGDC_LANG if present
      if (window.IGDC_LANG && typeof window.IGDC_LANG.changeLanguage === "function"){
        window.IGDC_LANG.changeLanguage(lang);
      } else if (window.__IGDC_LANG__ && typeof window.__IGDC_LANG__.changeLanguage === "function"){
        window.__IGDC_LANG__.changeLanguage(lang);
      } else if (typeof window.changeLanguage === "function"){
        window.changeLanguage(lang);
      }
    }catch(e){}
  }
  // Save on login button click
  document.addEventListener("click", function(e){
    var btn = e.target && e.target.closest ? e.target.closest("#osLoginBtn") : null;
    if(!btn) return;
    try{
      var sel = (document.querySelector(".language-select")||{});
      if (sel && sel.value) localStorage.setItem(LANG_KEY, sel.value);
    }catch(_){}
  }, true);
  // Restore on boot and on auth events
  function restore(){
    try{
      var queryLang = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
      applyLang((queryLang && pageMap[queryLang]) ? queryLang : (localStorage.getItem(LANG_KEY) || detectPref()));
    }catch(_){ }
  }
  document.addEventListener("DOMContentLoaded", restore);
  document.addEventListener("osauth:ready", restore);
  document.addEventListener("osauth:done", restore, true);

  // ===== 2) Double-reload guard around Auth0 callbacks =====
  (function(){
    var doneOnce = false;
    // Stop duplicate 'message' events bubbling 'osauth:done'
    window.addEventListener("message", function(ev){
      try{
        if (ev && ev.data === "osauth:done"){
          if (doneOnce){ ev.stopImmediatePropagation && ev.stopImmediatePropagation(); ev.stopPropagation && ev.stopPropagation(); return; }
          doneOnce = true;
          setTimeout(function(){ doneOnce = false; }, 1500);
        }
      }catch(_){}
    }, true);

    // Debounce location.reload() while auth completes
    (function(){
      var origReload = location.reload;
      var last = 0;
      Object.defineProperty(location, "reload", {
        configurable: true,
        writable: true,
        value: function(){
          var now = Date.now();
          if (now - last < 1200) { return; } // ignore rapid repeats
          last = now;
          try { return origReload.apply(location, arguments); } catch(e){}
        }
      });
    })();

    // Soft-block rapid redirect loop to "/index.html" immediately after token exchange
    (function(){
      var origAssign = location.assign.bind(location);
      var origReplace= location.replace.bind(location);
      function shouldBlock(url){
        try{
          var u = new URL(url, location.href);
          return (u.pathname === "/index.html" && (performance.now() < 2000));
        }catch(_){ return false; }
      }
      location.assign = function(url){ if(shouldBlock(url)) return; return origAssign(url); };
      location.replace= function(url){ if(shouldBlock(url)) return; return origReplace(url); };
    })();
  })();
})();
</script>

<script>
(function(){
  // ===== Token helpers (Auth0 local storage v2) =====

  // ===== Currency resolver =====
  function parseQueryCurrency(){
    try{
      const u = new URL(String(location.href));
      const c = u.searchParams.get("currency");
      return c ? c.trim().toUpperCase() : null;
    }catch(_){ return null; }
  }
  function langHints(){
    const out = [];
    try{ const htmlLang = (document.documentElement && document.documentElement.lang) || ""; if (htmlLang) out.push(htmlLang); }catch(_){}
    try{ if (navigator && navigator.language) out.push(navigator.language); }catch(_){}
    try{ if (navigator && Array.isArray(navigator.languages)) out.push.apply(out, navigator.languages); }catch(_){}
    return out.map(s=>String(s).toLowerCase());
  }
  function mapLangToCurrency(code){
    // Core set only: USD, EUR, KRW, JPY, CNY, GBP (extendable)
    if (!code) return null;
    if (code.startsWith("ko")) return "KRW";
    if (code.startsWith("ja")) return "JPY";
    if (code.startsWith("zh")) return "CNY";
    if (code.startsWith("en-us")) return "USD";
    if (code.startsWith("en-gb")) return "GBP";
    if (code.startsWith("en")) return "USD";
    if (code.startsWith("fr")) return "EUR";
    if (code.startsWith("de")) return "EUR";
    if (code.startsWith("es")) return "EUR";
    if (code.startsWith("it")) return "EUR";
    if (code.startsWith("pt")) return "EUR";
    if (code.startsWith("ru")) return "EUR";
    return null;
  }
  let __DEFAULT_CCY = (function(){
    const q = parseQueryCurrency();
    if (q) return q;
    const hints = langHints();
    for (const h of hints){
      const m = mapLangToCurrency(h);
      if (m) return m;
    }
    return "USD";
  })();
  window.IGDC = window.IGDC || {};
  window.IGDC.getCurrency = function(){ return __DEFAULT_CCY; };
  window.IGDC.setCurrency = function(ccy){
    if (typeof ccy === "string" && /^[A-Z]{3,4}$/.test(ccy)) __DEFAULT_CCY = ccy.toUpperCase();
  };

  const STORAGE = { TOKENS:"osauth.tokens.v2" };
  function load(name){ try{ return JSON.parse(localStorage.getItem(name)||"null"); }catch(_){ return null; } }
  function getTokens(){ return load(STORAGE.TOKENS); }
  function getAccessToken(){ const t=getTokens(); return t ? (t.access_token||null) : null; }
  function getIdPayload(){
    const t=getTokens(); if(!t || !t.id_token) return null;
    try{ const p=t.id_token.split('.')[1]; const s=p.replace(/-/g,'+').replace(/_/g,'/'); const pad=s.length%4; 
      const b64 = s + (pad? '='.repeat(4-pad):''); 
      return JSON.parse(atob(b64));
    }catch(_){ return null; }
  }
 
// ===== Admin UI gate (SAFE, LIMITED) =====
function applyAdminGate(){
  try{
    const role = (window.__IGDC_ROLE || "guest").toLowerCase();

    // admin / owner 계열 판정 (suffix 포함)
    const isAdminLike =
      role === "admin" ||
      role.startsWith("admin_") ||
      role === "owner" ||
      role.startsWith("owner_");

    // Admin nav is gated only by data-role. Do not rely on hard-coded nav order.
    // data-role gate
    document.querySelectorAll("[data-role]").forEach(el=>{
      const need = (el.getAttribute("data-role") || "").toLowerCase();
      if (!need) return;

      // admin UI는 admin/owner 계열만
      if (need === "admin") {
        el.style.display = isAdminLike ? "" : "none";
        return;
      }

      // 그 외 role은 base role 기준
      el.style.display = (need === role) ? "" : "none";
    });

  }catch(e){}
}


document.addEventListener("DOMContentLoaded", applyAdminGate);
document.addEventListener("osauth:ready", applyAdminGate);


  // ===== Payment Bridge =====
  // Policy: 
  // - If current iframe page includes 'donation' (case-insensitive), allow guest (no token) up to 5~50 USD.
  // - Other pages require a bearer access token.
  const DONATION_MIN = 5, DONATION_MAX = 50;
  function isDonationContext(){
    try{
      const f = document.getElementById("mainFrame");
      const src = (f && f.getAttribute("src")) || "";
      return /donation/i.test(src);
    }catch(_){ return false; }
  }
  async function forwardToAdmin(payload){
    const pg = String(location.pathname||"/index.html");
    const ua = (navigator && navigator.userAgent) || "";
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
    const lang = (document.documentElement && document.documentElement.lang) || "en";

    const amount = Number(payload && payload.amount || 0);
    let currency = String((payload && payload.currency) || (__DEFAULT_CCY||"USD")).toUpperCase().slice(0,4);
    const memo = String((payload && payload.memo) || "Donation").slice(0,140);
    const meta = Object.assign({}, payload && payload.meta || {});

    // Token policy
    const token = getAccessToken();
    const inDonation = isDonationContext();
    if (!inDonation){
      if (!token){ throw new Error("AUTH_REQUIRED"); }
    } else {
      if (!(amount >= DONATION_MIN && amount <= DONATION_MAX)){
        throw new Error("DONATION_LIMIT"); // client-side guard
      }
    }

    const body = {
      amount, currency, memo, meta,
      context: { page: (document.getElementById("mainFrame")||{}).src || pg, locale: lang, tz, ua },
      token: token || null,
      guest: (!!inDonation && !token) ? true : false
    };

    const res = await fetch("/admin/api/payment-intent", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify(body)
    });
    if(!res.ok){
      let msg = "REQUEST_FAILED";
      try{ const j = await res.json(); msg = j && j.error || msg; }catch(_){}
      throw new Error(msg);
    }
    return await res.json();
  }

  // Expose API
  window.IGDC = window.IGDC || {};
  window.IGDC.requestPayment = function(opts){ return forwardToAdmin(opts||{}); };

  // Iframe message bridge for front pages
  window.addEventListener("message", async (ev)=>{
    try{
      const d = ev && ev.data || {};
      if (d && d.type === "IGDC_REQUEST_PAYMENT"){
        const res = await forwardToAdmin(d.payload||{});
        ev.source && ev.source.postMessage({ type:"IGDC_PAYMENT_RESULT", ok:true, result:res }, "*");
      }
    }catch(e){
      try{ ev.source && ev.source.postMessage({ type:"IGDC_PAYMENT_RESULT", ok:false, error:String(e && e.message || e) }, "*"); }catch(_){}
    }
  }, false);

})();
</script>

<script>
(function(){
  'use strict';
  const IGDC_REVERSE_LOCK = false; // single-scroll: parent only
  if (!IGDC_REVERSE_LOCK) return;

  var MIN = 200;
  var ALPHA = 200;
  var SEL = '#mainFrame, iframe';
  function q(sel){ return document.querySelector(sel); }
  function isSameOrigin(frame){ try{ void frame.contentDocument; return true; }catch(e){ return false; } }
  function setParentOverflow(hidden){
    try{
      var v = hidden ? 'hidden' : 'auto';
      document.documentElement.style.overflow = v;
      if (document.body) document.body.style.overflow = v;
    }catch(_){}
  }
  function ensureFrameStyles(frame){
    frame.style.display = 'block';
    frame.style.border = '0';
    if (!frame.style.width) frame.style.width = '100%';
  }
  function setFrame100vh(frame){
    frame.style.setProperty('height', '100vh', 'important');
    try{ frame.setAttribute('scrolling','auto'); }catch(_){}
    frame.style.overflow = 'auto';
  }
  function childNeedsScroll(frame){
    try{
      var doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
      var de = doc && doc.documentElement, bo = doc && doc.body;
      var viewport = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);
      var h = Math.max(
        (de && de.scrollHeight) || 0,
        (bo && bo.scrollHeight) || 0,
        (de && de.getBoundingClientRect ? de.getBoundingClientRect().height : 0) || 0,
        (bo && bo.getBoundingClientRect ? bo.getBoundingClientRect().height : 0) || 0
      );
      return h > Math.max(MIN, viewport);
    }catch(_){ return null; }
  }
  function apply(frame){
    ensureFrameStyles(frame);
    var same = isSameOrigin(frame);
    if (!same){
      setParentOverflow(false);
      var viewport = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);
      frame.style.setProperty('height', Math.max(MIN, viewport + ALPHA) + 'px', 'important');
      return;
    }
    var need = childNeedsScroll(frame);
    if (need === null){
      setParentOverflow(false);
      var viewport = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);
      frame.style.setProperty('height', Math.max(MIN, viewport + ALPHA) + 'px', 'important');
      return;
    }
    if (need){
      setParentOverflow(true);
      setFrame100vh(frame);
    }else{
      setParentOverflow(false);
      try{
        var doc = frame.contentDocument || frame.contentWindow.document;
        var de = doc.documentElement, bo = doc.body;
        var h = Math.max(
          (de && de.scrollHeight) || 0,
          (bo && bo.scrollHeight) || 0,
          (de && de.offsetHeight) || 0,
          (bo && bo.offsetHeight) || 0
        );
        frame.style.setProperty('height', Math.max(MIN, Math.round(h||0) + ALPHA) + 'px', 'important');
      }catch(_){
        var viewport = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);
        frame.style.setProperty('height', Math.max(MIN, viewport + ALPHA) + 'px', 'important');
      }
    }
  }
  function init(){
    var frame = q(SEL);
    if (!frame) return;
    apply(frame);
    frame.addEventListener('load', function(){ apply(frame); });
    window.addEventListener('resize', function(){ apply(frame); }, { passive:true });
  }
  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init, { once:true });
  } else { init(); }
})();

(function(){

    }

      var btn=ensureBtn(); if(!btn) return;
      var L=lang2(); var d=I18N[L]||I18N.en;
      var collapsed=document.body.classList.contains('igdc-collapsed');
      btn.textContent = collapsed ? d.show : d.hide;
    }
    function setCollapsed(on){
      document.body.classList.toggle('igdc-collapsed', !!on);
      localize();
    }

    (function(){

      if (typeof orig==='function' && !orig.__igdcHooked){
        window.changeLanguage=function(lang){

        };
        window.changeLanguage.__igdcHooked=true;
      }
    })();

    // ---- postMessage listener from child pages ----
    window.addEventListener('message', function(ev){
      try{
        var d = ev.data||{};

<style id="igdc-scroll-shim-style">
  /* Header: visual hide; when hidden, remove space and ignore pointer events */
  header { transition: transform .25s ease; will-change: transform; }
  body.igdc-fixed-collapsed header {
    transform: translateY(-100%);
    height:0; margin:0; padding-top:0; padding-bottom:0; overflow:hidden;
    pointer-events:none;

  /* Nav: always sticky; visual-only transitions */
  nav { position: sticky !important; top: 0 !important; z-index: 1000 !important; }
  nav, nav * { transition-property: color, background-color, opacity, box-shadow !important; }

  /* Hide horizontal scrollbar inside nav only (mobile drag OK) */
  nav { overflow-x: auto; overflow-y: visible; scrollbar-width: none; -ms-overflow-style: none; }
  nav::-webkit-scrollbar { display: none; }

  /* Index (parent) scrollbar OFF; child owns vertical scroll */
  html, body { height:100%; overflow: hidden; overscroll-behavior-y: contain; }

  /* Mobile override: allow parent scroll and auto height so content (including footers) is not clipped */
  @media (max-width: 1024px){
    html, body{
      height: auto;
      min-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
    }
  }

 #mainFrame {

<script id="igdc-scroll-shim-js">
(function(){
  'use strict';
  var w = window, d = document;

  // Helpers
  function nav(){ return d.querySelector('nav'); }
  function header(){ return d.querySelector('header'); }
  function collapse(){ d.body.classList.add('igdc-fixed-collapsed'); setHeadVar(0); }
  function expand(){ d.body.classList.remove('igdc-fixed-collapsed'); setTimeout(syncVars, 10); }
  function px(n){ return (Math.max(0, Math.round(n||0)) + 'px'); }

  function navHeight(){
    var n = nav(); if (!n) return 48;
    var r = n.getBoundingClientRect();
    return Math.max(32, Math.round(r.height || 48));
  }
  function headHeight(){
    var h = header(); if (!h) return 0;
    // When collapsed class exists, treat as 0
    if (d.body.classList.contains('igdc-fixed-collapsed')) return 0;
    var r = h.getBoundingClientRect();
    return Math.max(0, Math.round(r.height || 0));
  }
  function setNavVar(val){ d.documentElement.style.setProperty('--igdc-nav-h', px(val)); }
  function setHeadVar(val){ d.documentElement.style.setProperty('--igdc-head-h', px(val)); }
  function syncVars(){
    setNavVar(navHeight());
    setHeadVar(headHeight());
  }

  // Initial sync + on resize
  syncVars();
  w.addEventListener('resize', function(){ syncVars(); }, { passive:true });

  // 1) Header behavior: collapse on first scroll; restore on overscroll release OR existing toggle button
  try{
    var firstCollapsed = false;
    function collapseOnce(){ if (firstCollapsed) return; firstCollapsed = true; collapse(); }
    w.addEventListener('scroll', collapseOnce, { passive:true, once:true });

    // Touch overscroll (release to restore)
    (function(){
      var startY = 0, maxPull = 0, active = false;
      var THRESH = 44;
      d.addEventListener('touchstart', function(ev){
        var t = ev.touches && ev.touches[0]; if (!t) return;
        startY = t.clientY; maxPull = 0; active = true;
      }, { passive:true });
      d.addEventListener('touchmove', function(ev){
        if (!active) return;
        var t = ev.touches && ev.touches[0]; if (!t) return;
        var dy = t.clientY - startY;
        if (dy > maxPull) maxPull = dy;
      }, { passive:true });
      d.addEventListener('touchend', function(){
        var isMobile = (w.matchMedia && w.matchMedia('(max-width: 1024px)').matches);
        if (maxPull >= 44){
          if (isMobile){
            // Mobile: fully expand header/index on pull-down, no auto-collapse re-toggle
            d.body.classList.remove('igdc-fixed-collapsed');
            d.body.classList.remove('igdc-collapsed');
            setTimeout(syncVars, 10);
            firstCollapsed = false;
          } else {
            // Desktop / non-mobile: keep existing toggle behavior
            expand();
            firstCollapsed = false;
            w.addEventListener('scroll', collapseOnce, { passive:true, once:true });
          }
        }
        active = false; maxPull = 0;
      }, { passive:true });
    })();

    // Wheel/trackpad overscroll: restore on intent after quiet
    (function(){
      var acc = 0, timer = 0;
      var THRESH_WHEEL = -120, QUIET_MS = 140;
      d.addEventListener('wheel', function(ev){
        if (ev.deltaY < 0){ acc += ev.deltaY; } else { acc = 0; }
        clearTimeout(timer);
        timer = setTimeout(function(){
          if (acc <= THRESH_WHEEL){
            expand();
            firstCollapsed = false;
            w.addEventListener('scroll', collapseOnce, { passive:true, once:true });
          }
          acc = 0;
        }, QUIET_MS);
      }, { passive:true });
    })();

    // Manual toggle by EXISTING button only (no auto injection)
    d.addEventListener('click', function(ev){
      var el = ev.target && ev.target.closest('[data-role="header-toggle"]');
      if (!el) return;
      ev.preventDefault();
      if (d.body.classList.contains('igdc-fixed-collapsed')){
        expand(); firstCollapsed = false;
        w.addEventListener('scroll', collapseOnce, { passive:true, once:true });
      }else{
        collapse(); firstCollapsed = true;
      }
      // After transition, resync sizes (push/pull)
      setTimeout(syncVars, 260);
    }, { passive: true });
  }catch(e){}

  // 2) NAV scroll buttons (opt-in)
  try{
    var n = nav();
    if (n){
      var prev = n.querySelector('[data-nav-scroll="prev"]');
      var next = n.querySelector('[data-nav-scroll="next"]');
      function scrollByStep(dir){
        var track = n;
        var step = Math.max(120, Math.round(track.clientWidth * 0.5));
        track.scrollBy({ left: dir * step, behavior: 'smooth' });
      }
      if (prev){ prev.addEventListener('click', function(e){ e.preventDefault(); scrollByStep(-1); }, { passive:false }); }
      if (next){ next.addEventListener('click', function(e){ e.preventDefault(); scrollByStep(+1); }, { passive:false }); }
    }
  }catch(e){}

  // 3) Child scroll target
  try{
    var frame = d.getElementById('mainFrame') || d.querySelector('iframe');
    if (frame){
      frame.setAttribute('scrolling', 'auto');
      frame.addEventListener('load', function(){
        setTimeout(syncVars, 50);
        setTimeout(syncVars, 300);
      }, { once:false });
    }
  }catch(e){}
})();
</script>

<script id="igdc-admin-bridge">
(function () {
  try {
    if (!window.osAuth || !osAuth.getIdTokenPayload) {
      setRole("guest", "guest");
      return;
    }

    const payload = osAuth.getIdTokenPayload() || {};

    /* 1️⃣ Auth0 role 수집 */
    const ROLE_KEYS = [
      "https://example.com/roles",
      "https://osu/roles",
      "roles",
      "role",
      "permissions"
    ];

    let rawRoles = [];
    ROLE_KEYS.forEach(key => {
      const v = payload[key];
      if (Array.isArray(v)) {
        v.forEach(r => rawRoles.push(String(r)));
      } else if (typeof v === "string") {
        v.split(",").forEach(r => rawRoles.push(r.trim()));
      }
    });

    if (!rawRoles.length) {
      setRole("guest", "guest");
      return;
    }

    /* 2️⃣ base role만 판단 */
    const BASE_ROLES = [
      "owner",
      "admin",
      "director",
      "coordinator_director",
      "site_manager",
      "commerce_manager",
      "special_member",
      "member"
    ];

    let finalBase = "guest";
    let finalLabel = "guest";

    rawRoles.some(raw => {
      const r = raw.toLowerCase();

      for (const base of BASE_ROLES) {
        if (r === base || r.startsWith(base + "_")) {
          finalBase = base;
          finalLabel = r; // 뒤는 전부 raw 패키지 그대로
          return true;
        }
      }
      return false;
    });

    /* 3️⃣ IGDC → IGTC 브릿지 */
    setRole(finalBase, finalLabel);

  } catch (e) {
    console.error("[igdc-admin-bridge]", e);
    setRole("guest", "guest");
  }

  function setRole(base, label) {
    // IGDC
    window.__IGDC_ROLE = base;
    window.__IGDC_ROLE_LABEL = label;

    // IGTC Role Inline v3
    window.__IGTC_ROLE = base;
    window.__IGTC_ROLE_LABEL = label;

    // DOM hook
    document.documentElement.dataset.role = base;

    // Storage backup
    try {
      localStorage.setItem("igdc_role", base);
      localStorage.setItem("igdc_role_label", label);
    } catch (_) {}
  }
})();
</script>

<!-- Robust language persistence handler (injected) -->
<script>
(function(){
  'use strict';
function normLang(l){
  if(!l) return null;
  var s = String(l).trim().toLowerCase();

  var map = {
    'kr':'ko','ko-kr':'ko','ko_kr':'ko','korean':'ko',
    'jp':'ja','ja-jp':'ja',

    // Simplified Chinese
    'zh-cn':'zh','zh_cn':'zh',
    'zh-hans':'zh','zh_hans':'zh',
    'zh-sg':'zh','zh_sg':'zh',

    // Traditional Chinese
    'zht':'zht',
    'zh-tw':'zht','zh_tw':'zht',
    'zh-hant':'zht','zh_hant':'zht',
    'zh-hk':'zht','zh_hk':'zht',
    'zh-mo':'zht','zh_mo':'zht',

    'en-us':'en','en-gb':'en'
  };

  if(map[s]) return map[s];

  if(s.indexOf('-') !== -1 || s.indexOf('_') !== -1){
    var base = s.split(/[-_]/)[0];
    if(base === 'zh') return 'zh';
    return base;
  }

  return s;
}

  function getQueryLang(){
    try{ var p = new URLSearchParams(location.search); return p.get('lang'); }catch(e){return null;}
  }
  function readStored(){
    try{ return localStorage.getItem('igdc_lang'); }catch(e){return null;}
  }
  function writeStored(v){
    try{ localStorage.setItem('igdc_lang', v); }catch(e){}
  }
  function applyHtmlLang(v){
    try{ if(v) document.documentElement.setAttribute('lang', v); }
    catch(e){}
  }

  // Determine language but DO NOT force a default if none present.
  (function init(){
    var q = normLang(getQueryLang());
    if(q){
      writeStored(q);
      applyHtmlLang(q);
      // do not redirect; just set
      return;
    }
    var s = normLang(readStored());
    if(s){
      applyHtmlLang(s);
      return;
    }
    // if document already has lang attribute, normalize it but do not override
    var docl = normLang(document.documentElement.getAttribute('lang'));
    if(docl){
      applyHtmlLang(docl);
      return;
    }
    // else: leave document.lang untouched (no forced default)
  })();

  // Attach handler to common select / UI controls to persist language
  function attachHandlers(){
    var selectors = [
      '#lang-select',
      'select[name="lang-select"]',
      'select.lang-select',
      '[data-lang-control]'
    ];
    selectors.forEach(function(sel){
      try{
        var el = document.querySelector(sel);
        if(el) bind(el);
      }catch(e){}
    });
    // also bind any anchor links with data-lang attribute
    document.querySelectorAll('a[data-lang]').forEach(function(a){
      a.addEventListener('click', function(ev){
        try{
          var v = a.getAttribute('data-lang');
          if(!v) return;
          v = normLang(v);
          if(!v) return;
          writeStored(v);
          applyHtmlLang(v);
        }catch(e){}
      }, {passive:true});
    });
    // generic bind for future dynamically created controls (event delegation)
    document.addEventListener('change', function(ev){
      var t = ev.target;
      if(!t) return;
      if(t.matches && (t.matches('select') || t.matches('[data-lang-control]'))) {
        try{
          var val = t.value || t.getAttribute('data-lang');
          val = normLang(val);
          if(!val) return;
          writeStored(val); applyHtmlLang(val);
          if(typeof window.setLanguage === 'function'){
            try{ window.setLanguage(val); }catch(e){} 
          }
        }catch(e){}
      }
    }, {capture:false, passive:true});
  }

  function bind(el){
    if(!el) return;
    // for select elements
    if(el.tagName && el.tagName.toLowerCase()==='select'){
      el.addEventListener('change', function(e){
        var v = e.target.value;
        v = normLang(v);
        if(!v) return;
        writeStored(v); applyHtmlLang(v);
        if(typeof window.setLanguage === 'function'){
          try{ window.setLanguage(v); }catch(e){}
        }
      }, {passive:true});
    } else {
      // for generic controls with data-lang attribute
      el.addEventListener('click', function(e){
        try{
          var v = el.getAttribute('data-lang') || el.value;
          v = normLang(v);
          if(!v) return;
          writeStored(v); applyHtmlLang(v);
          if(typeof window.setLanguage === 'function'){
            try{ window.setLanguage(v); }catch(e){}
          }
        }catch(e){}
      }, {passive:true});
    }
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', attachHandlers);
  } else {
    attachHandlers();
  }
})();</script>

<script id="active-by-root-slim">
(function(){
  function toRootName(name){
    try{
      name = (name||"").toString().trim();
      name = name.replace(/[?#].*$/,"");           // strip query/hash
      name = name.split("/").pop();                // filename only
      name = name.replace(/\.(html?|php)$/i,"");   // ignore extension
      name = name.replace(/_[A-Za-z0-9\-]+$/,"");  // strip last underscore tail
      return name.toLowerCase();
    }catch(e){ return ""; }
  }
  function getLang(){
    try{
      return ((typeof currentLang !== 'undefined' && currentLang) || window.currentLang || (navigator.language||"en").slice(0,2) || "en").toLowerCase();
    }catch(e){ return "en"; }
  }
  function getMap(){
    try{
      var lang = getLang();
      if (window.pageMap && Array.isArray(window.pageMap[lang])) return window.pageMap[lang];
      if (window.pageMap && Array.isArray(window.pageMap["en"])) return window.pageMap["en"];
      return [];
    }catch(e){ return []; }
  }
  function resolveFromIframe(){
    var f = document.getElementById("mainFrame");
    if (!f) return "";
    // prefer live location if same-origin, else fallback to src attribute
    try{
      if (f.contentWindow && f.contentWindow.location && f.contentWindow.location.href){
        return f.contentWindow.location.href;
      }
    }catch(e){/* cross-origin, ignore */}
    return f.getAttribute("src") || "";
  }
  function findIndexByRoot(root){
    var map = getMap();
    if (!root) return -1;
    for (var i=0;i<map.length;i++){
      if (toRootName(map[i]) === root) return i;
    }
    return -1;
  }
  /* Front iframe links must reuse the parent shell instead of navigating the iframe to a public shell route. */
  function frontHubIndexFromHref(href){
    try{
      var url = new URL(href || '', location.origin);
      if (url.origin !== location.origin) return -1;
      var roots = {
        home:0,
        networkhub:1,
        distributionhub:2,
        socialnetwork:3,
        mediahub:4,
        tour:5
      };
      var root = toRootName(url.pathname);
      return Object.prototype.hasOwnProperty.call(roots, root) ? roots[root] : -1;
    }catch(e){ return -1; }
  }
  function policyPublicPath(root){
    var paths = {
      "terms": "/terms",
      "maru-windows-terms": "/terms",
      "privacy": "/privacy",
      "maru-windows-privacy": "/privacy",
      "refund": "/refund",
      "maru-windows-refund": "/refund"
    };
    return paths[root] || "";
  }
  function setActiveIndex(idx){
    try{
      document.querySelectorAll("nav a.active").forEach(function(a){ a.classList.remove("active"); });
      if (idx < 0) return;
      var a = document.querySelector('nav a[data-page-index="'+idx+'"]');
      if (!a){
        var list = document.querySelectorAll("nav a");
        if (list && list[idx]) a = list[idx];
      }
      if (a) a.classList.add("active");
    }catch(e){}
  }
  function syncActive(){
    var href = resolveFromIframe();
    var root = toRootName(href);
    var idx  = findIndexByRoot(root);
    if (idx >= 0) currentPageIndex = idx;
    setActiveIndex(idx);
    try{
      if (href) {
        var frameUrl = new URL(href, location.origin);
        if (frameUrl.origin === location.origin) {
          var map = getMap();
          var target = idx >= 0
            ? publicPageHref(map[idx] || frameUrl.pathname, idx)
            : policyPublicPath(root);
          if (!target) return;
          var nextUrl = withLanguage(target + (frameUrl.search || '') + (frameUrl.hash || ''), getLang());
          var currentUrl = location.pathname + location.search + location.hash;
          if (nextUrl !== currentUrl) {
            var state = {
              igdcPage:idx,
              lang:getLang(),
              frameSrc:frameUrl.pathname + (frameUrl.search || '') + (frameUrl.hash || '')
            };
            // The iframe navigation already owns this browser-history step.
            // Replace its top URL/state so one click never creates a duplicate entry.
            history.replaceState(state, '', nextUrl);
          }
        }
      }
    }catch(e){}
  }
  function hookPolicyNavigation(){
    try{
      var f = document.getElementById('mainFrame');
      var doc = f && f.contentDocument;
      if (!doc || doc.__igdcPolicyNavigationHooked) return;
      doc.__igdcPolicyNavigationHooked = true;
      doc.addEventListener('click', function(ev){
        try{
          if (ev.defaultPrevented || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
          var link = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
          if (!link) return;
          var href = link.href || link.getAttribute('href') || '';

          /* Sidebar + Home hub buttons: keep the one existing index shell and replace only mainFrame. */
          var frontIndex = frontHubIndexFromHref(href);
          if (frontIndex >= 0 && frontIndex <= 5) {
            ev.preventDefault();
            if (typeof loadPage === 'function') loadPage(frontIndex, null);
            return;
          }

          if (!policyPageHref(href)) return;
          ev.preventDefault();
          navigatePolicyFromFrame(href);
        }catch(e){}
      }, true);
    }catch(e){}
  }
  document.addEventListener("DOMContentLoaded", function(){
    var f = document.getElementById("mainFrame");
    if (f) f.addEventListener("load", function(){ hookPolicyNavigation(); setTimeout(syncActive, 20); }, true);
    try{
      if (typeof window.loadPage === "function"){
        var _orig = window.loadPage;
        window.loadPage = function(){ try{ return _orig.apply(this, arguments); } finally { setTimeout(syncActive, 20); } };
      }
    }catch(e){}
    hookPolicyNavigation();
    syncActive();
  });
})();
</script>

<script id="nav-1to1-href-first">
(function(){
  if (window.__NAV_HREF_FIRST__) return; window.__NAV_HREF_FIRST__=true;

  function $(sel, root=document){ return root.querySelector(sel); }
  function $$(sel, root=document){ return Array.from(root.querySelectorAll(sel)); }

  const frame = $('#mainFrame') || $('iframe#mainFrame, iframe[name="mainFrame"]');
  if (!frame) return;

  function setActiveByKey(key){
    ['nav a','.sidebar a','.menu a'].forEach(sel=>{
      $$(sel).forEach(a=>{
        const k=(a.getAttribute('data-nav')||'').toLowerCase();
        if(k===key){ a.classList.add('active'); a.setAttribute('aria-current','page'); }
        else{ a.classList.remove('active'); a.removeAttribute('aria-current'); }
      });
    });
  }

  function goByAnchor(a){
    const url = a.getAttribute('href');
    const key = (a.getAttribute('data-nav')||'').toLowerCase();
    if(!url || !key) return;
    const f = $('#mainFrame') || $('iframe#mainFrame, iframe[name="mainFrame"]');
    if(f) f.src = url;
    setActiveByKey(key);
  }

  // Capture clicks on any anchor that has data-nav
  document.addEventListener('click', function(ev){
    const a = ev.target && ev.target.closest && ev.target.closest('a[data-nav]');
    if(!a) return;
    ev.preventDefault();
    ev.stopPropagation();
    goByAnchor(a);
  }, true);

  // Sync active from frame URL by finding the first anchor whose href matches it
  function syncFromFrame(){
    let href='';
    try{ href = (frame.contentWindow && frame.contentWindow.location && frame.contentWindow.location.href || '').toLowerCase(); }catch(e){}

<script id="igdc-mobile-logout-final-guard-v1">
(function(){
  'use strict';
  var SYNC_MS = 700;
  var stopAfter = 0;

  function byId(id){ return document.getElementById(id); }
  function tokenObj(){
    try { return JSON.parse(localStorage.getItem('osauth.tokens.v2') || 'null'); } catch(e){ return null; }
  }
  function hasFreshToken(){
    try{
      if(window.IGDCMemberAuth && typeof window.IGDCMemberAuth.isAuthenticated === 'function'){
        return !!window.IGDCMemberAuth.isAuthenticated();
      }
    }catch(e){}
    try{
      var t = tokenObj();
      var exp = Number(t && t.exp || 0);
      return !!(t && exp && Math.floor(Date.now()/1000) < exp);
    }catch(e){ return false; }
  }
  function clearStaleRoleMarkers(){
    try{
      ['igdc_role','igdc_roles','igdc_role_label'].forEach(function(key){ localStorage.removeItem(key); sessionStorage.removeItem(key); });
      window.__IGDC_ROLE = 'guest';
      document.documentElement.dataset.role = 'guest';
      ['roleStatusBtn','igtcRoleText3','igtcRoleInline3','userRole'].forEach(function(id){
        var el = byId(id);
        if(el && /owner|admin|director|manager/i.test(String(el.textContent || ''))) el.textContent = '';
      });
    }catch(e){}
  }
  function isAuthed(){
    try{
      if(window.osAuth && typeof window.osAuth.isAuthenticated === 'function' && window.osAuth.isAuthenticated()) return true;
    }catch(e){}
    return hasFreshToken();
  }
  function modalConfirm(){
    return new Promise(function(resolve){
      var mask = byId('os-modal-mask');
      var box  = byId('os-modal');
      var ok   = byId('os-modal-ok');
      var no   = byId('os-modal-cancel');
      var title = byId('os-modal-title');
      var body  = byId('os-modal-body');
      if(!(mask && box && ok && no)){
        resolve(window.confirm('정말 로그아웃 하시겠습니까?'));
        return;
      }
      if(title) title.textContent = 'Confirm';
      if(body) body.textContent = '정말 로그아웃 하시겠습니까?';
      function off(result){
        try{ mask.style.display='none'; box.style.display='none'; }catch(e){}
        ok.onclick = null; no.onclick = null; mask.onclick = null;
        resolve(!!result);
      }
      ok.onclick = function(){ off(true); };
      no.onclick = function(){ off(false); };
      mask.onclick = function(){ off(false); };
      try{ mask.style.display='block'; box.style.display='block'; }catch(e){ resolve(false); }
    });
  }
  function clearAuthStorage(){
    var keys = [
      'osauth.tokens.v2','osauth.pkce.v1','id_token','os_id_token','access_token','os_access_token',
      'auth_token','igdc_token','IGDC_AUTH_TOKEN'
    ];
    keys.forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });
    try{ window.__IGDC_ROLE='guest'; document.documentElement.dataset.role='guest'; }catch(e){}
  }
  function doLogin(){
    try{
      if(typeof window.osLogin === 'function') { window.osLogin(); return; }
    }catch(e){}
    try{ location.href='/login'; }catch(e){}
  }
  function doLogout(){
    clearAuthStorage();
    try{
      if(window.osAuth && typeof window.osAuth.logout === 'function'){
        window.osAuth.logout();
        return;
      }
    }catch(e){}
    try{
      if(window.osauth && typeof window.osauth.logout === 'function'){
        window.osauth.logout();
        return;
      }
    }catch(e){}
    try{ location.reload(); }catch(e){ location.href='/index.html'; }
  }
  function syncLoginButton(){
    var btn = byId('osLoginBtn');
    if(!btn) return;
    if(window.__IGDC_AUTH_RESTORE_PENDING__) return;
    var authed = isAuthed();
    if(authed){
      if(btn.textContent !== 'Logout') btn.textContent = 'Logout';
      btn.setAttribute('aria-label','Logout');
      btn.setAttribute('data-igdc-auth-state','logout');
      btn.removeAttribute('data-os-login');
      btn.removeAttribute('data-os-logout');
    } else {
      clearStaleRoleMarkers();
      if(btn.textContent !== 'OS‑Login') btn.textContent = 'OS‑Login';
      btn.setAttribute('aria-label','OS-Login');
      btn.setAttribute('data-igdc-auth-state','login');
      btn.setAttribute('data-os-login','1');
      btn.removeAttribute('data-os-logout');
    }
  }
  document.addEventListener('click', async function(ev){
    var btn = ev.target && ev.target.closest && ev.target.closest('#osLoginBtn');
    if(!btn) return;
    ev.preventDefault();
    ev.stopPropagation();
    ev.stopImmediatePropagation();
    if(isAuthed()){
      syncLoginButton();
      var ok = await modalConfirm();
      if(ok) doLogout();
    } else {
      syncLoginButton();
      doLogin();
    }
  }, true);

  function boot(){
    syncLoginButton();
    stopAfter = Date.now() + 30000;
    var timer = setInterval(function(){
      syncLoginButton();
      if(Date.now() > stopAfter) clearInterval(timer);
    }, SYNC_MS);
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once:true });
  else boot();
  document.addEventListener('osauth:ready', function(){ stopAfter = Date.now() + 30000; syncLoginButton(); });
  document.addEventListener('igdc:session-refresh-complete', syncLoginButton);
  window.addEventListener('pageshow', syncLoginButton);
})();

<script id="igdc-canonical-authbar-v1">
(function(){
  'use strict';
  if (window.__IGDC_CANONICAL_AUTHBAR_V1__) return;
  window.__IGDC_CANONICAL_AUTHBAR_V1__ = true;

  var syncQueued = false;
  var repeatTimer = 0;

  function byId(id){ return document.getElementById(id); }
  function normal(value){ return String(value == null ? '' : value).trim().toLowerCase().replace(/[\s.]+/g, '_'); }
  function isFresh(payload){
    var exp = Number(payload && payload.exp || 0);
    return !!(payload && exp && exp * 1000 > Date.now() + 15000);
  }
  function languageIsKorean(){
    try {
      var lang = document.documentElement.getAttribute('lang') || 'ko';
      return /^ko(?:[-_]|$)/i.test(lang);
    } catch (_) { return true; }
  }
  function guestLabel(){ return languageIsKorean() ? '게스트' : 'Guest'; }
  function roleRank(role){
    var ranks = { guest:0, member:1, member_standard:2, member_premium:3, special_member:4,
      commerce_manager:5, site_manager:12, coordinator_director:13, site_manager_director:14,
      director:15, admin:20, super_admin:25, owner:30 };
    role = normal(role);
    if (Object.prototype.hasOwnProperty.call(ranks, role)) return ranks[role];
    if (role.indexOf('site_manager_') === 0) return 12;
    return 0;
  }
  function highestRole(values){
    var best = 'guest';
    var bestRank = 0;
    (values || []).forEach(function(value){
      var role = normal(value);
      var rank = roleRank(role);
      if (rank > bestRank) { best = role; bestRank = rank; }
    });
    return best;
  }
  function getFreshIdentity(){
    try{
      var auth = window.IGDCMemberAuth;
      if (!auth || typeof auth.getIdTokenPayload !== 'function') return { authenticated:false, role:'guest', label:guestLabel() };
      var payload = auth.getIdTokenPayload();
      if (!isFresh(payload)) return { authenticated:false, role:'guest', label:guestLabel() };
      var roles = typeof auth.getRoles === 'function' ? auth.getRoles() : [];
      var role = highestRole(roles);
      return { authenticated:true, role:role, label:role || 'member' };
    }catch(_){
      return { authenticated:false, role:'guest', label:guestLabel() };
    }
  }
  function clearLegacyRoleMarkers(){
    ['igdc_role','igdc_roles','igdc_role_label'].forEach(function(key){
      try { localStorage.removeItem(key); } catch (_) {}
      try { sessionStorage.removeItem(key); } catch (_) {}
    });
  }
  function canonicalBadge(){
    var badge = byId('igtcRoleInline3');
    var old = byId('roleStatusBtn');
    if (!badge && old) {
      old.removeAttribute('id');
      badge = old;
      badge.id = 'igtcRoleInline3';
    }
    if (!badge) {
      badge = document.createElement('div');
      badge.id = 'igtcRoleInline3';
      var header = document.querySelector('header') || document.body;
      header.insertBefore(badge, header.firstChild || null);
    }
    if (old && old !== badge && old.parentNode) old.parentNode.removeChild(old);
    var text = byId('igtcRoleText3');
    if (!text || !badge.contains(text)) {
      badge.textContent = '';
      text = document.createElement('span');
      text.id = 'igtcRoleText3';
      badge.appendChild(text);
    }
    return { badge:badge, text:text };
  }
  function alignBadge(badge){
    try{
      var header = document.querySelector('header');
      var login = byId('osLoginBtn');

      badge.style.left = Math.max(0, Math.round((lb.left - hb.left) + lb.width + 2)) + 'px';

    document.addEventListener('osauth:done', schedule, true);
    document.addEventListener('igdc:member-auth-ready', schedule, true);

<script id="igdc-donation-nav-gate-v2">
(function(){
  'use strict';
  if (window.__IGDC_DONATION_NAV_GATE_V2__) return;
  window.__IGDC_DONATION_NAV_GATE_V2__ = true;

  var CLAIM_BLOCKED = 'https://igdcglobal.com/donation_blocked';
  var GEO_URL = '/api/igdc-country-geo';
  var SEARCHBANK_URL = '/.netlify/functions/search-bank-engine';
  var ROLE_KEYS = [
    'https://igdcglobal.com/roles', 'https://os.auth/roles', 'https://os0.app/roles',
    'https://example.com/roles', 'https://osu/roles', 'roles', 'role'
  ];
  var syncQueued = false;
  var repeatTimer = 0;
  var geoStarted = false;
  var geoReady = false;
  var geoExcluded = false;
  var geoCountry = '';
  var policyStartedFor = '';
  var policyReady = false;
  var policyDonationBlocked = false;

  function normalize(value){
    return String(value == null ? '' : value)
      .trim()
      .toLowerCase()
      .replace(/[\s.]+/g, '_');
  }

  function getPayload(){
    try {
      if (window.IGDCMemberAuth && typeof window.IGDCMemberAuth.getIdTokenPayload === 'function') {
        return window.IGDCMemberAuth.getIdTokenPayload() || null;
      }
    } catch (_) {}
    try {
      if (window.osAuth && typeof window.osAuth.getIdTokenPayload === 'function') {
        return window.osAuth.getIdTokenPayload() || null;
      }
    } catch (_) {}
    return null;
  }

  function isFresh(payload){
    var exp = Number(payload && payload.exp || 0);
    return !!(payload && (!exp || exp * 1000 > Date.now() + 15000));
  }

  function getRoles(payload){
    try {
      if (window.IGDCMemberAuth && typeof window.IGDCMemberAuth.getRoles === 'function') {
        return (window.IGDCMemberAuth.getRoles() || []).map(normalize).filter(Boolean);
      }
    } catch (_) {}
    var roles = [];
    ROLE_KEYS.forEach(function(key){
      var value = payload && payload[key];
      if (Array.isArray(value)) {
        value.forEach(function(role){ roles.push(normalize(role)); });
      } else if (typeof value === 'string') {
        value.split(',').forEach(function(role){ roles.push(normalize(role)); });
      }
    });
    return roles.filter(Boolean);
  }

  function isOwnerOrAdmin(roles){
    return roles.some(function(role){
      return role === 'owner' || role.indexOf('owner_') === 0 ||
             role === 'admin' || role.indexOf('admin_') === 0 ||
             role === 'super_admin';
    });
  }

  function isBlockedClaim(payload){
    var value = payload && payload[CLAIM_BLOCKED];
    return value === true || String(value).toLowerCase() === 'true';
  }

  function beginPolicy(country){
    country = String(country || '').trim().toUpperCase();
    if (!/^[A-Z]{2}$/.test(country)) {
      policyReady = false;
      policyDonationBlocked = false;
      return;
    }
    if (policyStartedFor === country) return;
    policyStartedFor = country;
    policyReady = false;
    policyDonationBlocked = false;

    var url = SEARCHBANK_URL + '?channel=donation&country=' + encodeURIComponent(country) + '&list=1&limit=1';
    fetch(url, { cache:'no-store', credentials:'same-origin' })
      .then(function(res){ return res && res.ok ? res.json() : null; })
      .then(function(data){
        var operational = data && data.operational_policy;
        var blocked = operational && Array.isArray(operational.blockedChannels)
          ? operational.blockedChannels.map(function(v){ return String(v || '').toLowerCase(); })
          : null;
        if (!blocked) throw new Error('donation_policy_unresolved');
        policyDonationBlocked = blocked.indexOf('donation') !== -1;
        policyReady = true;
        schedule();
      })
      .catch(function(){
        /* Fail closed: never reveal Donation until the canonical country policy resolves. */
        policyReady = false;
        policyDonationBlocked = false;
        schedule();
      });
  }

  function beginGeo(){
    if (geoStarted) return;
    geoStarted = true;
    fetch(GEO_URL, { cache:'no-store', credentials:'same-origin' })
      .then(function(res){ return res && res.ok ? res.json() : null; })
      .then(function(data){
        geoReady = true;
        geoExcluded = !!(data && data.excluded === true);
        geoCountry = String(data && (data.detectedCountry || data.country) || '').trim().toUpperCase();
        beginPolicy(geoCountry);
        schedule();
      })
      .catch(function(){
        /* Fail closed: without a request-IP country decision Donation stays hidden. */
        geoReady = false;
        geoExcluded = false;
        geoCountry = '';
        policyReady = false;
        schedule();
      });
  }

  function setAllowed(link, allowed){
    /* The original Donation anchor remains the canonical policy state. CSS keeps it visually hidden. */
    link.style.display = allowed ? '' : 'none';
    link.setAttribute('aria-hidden', allowed ? 'false' : 'true');

    /* Replacement icon/arrow follows the canonical Donation anchor 1:1. */
    var arrow = document.getElementById('igdcDonationArrowTrigger');
    if (arrow) {
      arrow.style.display = allowed ? 'inline-flex' : 'none';
      arrow.setAttribute('aria-hidden', allowed ? 'false' : 'true');
      arrow.setAttribute('tabindex', allowed ? '0' : '-1');
    }
    document.documentElement.dataset.igdcDonationReady = '1';
  }

  function apply(){
    syncQueued = false;
    var link = document.querySelector('nav [data-igdc-donation-nav="1"]');
    if (!link) return;

    beginGeo();
    var payload = getPayload();
    var authenticated = isFresh(payload);
    var roles = authenticated ? getRoles(payload) : [];

    /* owner/admin/super_admin may inspect Donation from every country. */
    if (authenticated && isOwnerOrAdmin(roles)) {
      setAllowed(link, true);
      return;
    }

    /* Do not reveal Donation before both request-IP and canonical Donation policy resolve. */
    if (!geoReady || !policyReady) {
      setAllowed(link, false);
      delete document.documentElement.dataset.igdcDonationReady;
      return;
    }

    /* Ordinary members and guests share the same request-IP Donation country policy. */
    var blocked = geoExcluded || policyDonationBlocked || (authenticated && isBlockedClaim(payload));
    setAllowed(link, !blocked);
  }

  function schedule(){
    if (syncQueued) return;
    syncQueued = true;
    if (window.requestAnimationFrame) window.requestAnimationFrame(apply);
    else setTimeout(apply, 0);
  }

  function arm(){
    beginGeo();
    schedule();
    document.addEventListener('osauth:ready', schedule, true);
    document.addEventListener('osauth:done', schedule, true);
    document.addEventListener('igdc:member-auth-ready', schedule, true);
    document.addEventListener('igdc:session-refresh-complete', schedule, true);
    window.addEventListener('pageshow', schedule);
    window.addEventListener('storage', schedule);

    var deadline = Date.now() + 30000;
    repeatTimer = window.setInterval(function(){
      schedule();
      if (Date.now() > deadline) {
        window.clearInterval(repeatTimer);
        repeatTimer = 0;
      }
    }, 750);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', arm, { once:true });
  } else {
    arm();
  }
})();
</script>
<!-- /IGDC donation navigation auth/country gate v2 -->
